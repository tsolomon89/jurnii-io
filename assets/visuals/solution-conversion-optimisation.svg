<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="funnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5299ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5299ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="#0A0A0A"/>

  <!-- Funnel Graphic -->
  <path d="M 200 50 L 600 50 L 500 300 L 300 300 Z" fill="url(#funnel)" stroke="rgba(82,153,255,0.5)" stroke-width="2"/>
  
  <!-- Stage Lines -->
  <line x1="240" y1="110" x2="560" y2="110" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="180" y="115" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="12" text-anchor="end">VISIT</text>
  
  <line x1="280" y1="180" x2="520" y2="180" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="180" y="185" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="12" text-anchor="end">REGISTER</text>

  <line x1="320" y1="250" x2="480" y2="250" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="180" y="255" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="12" text-anchor="end">DEPOSIT</text>

  <!-- Dropping particles -->
  <circle cx="400" cy="50" r="4" fill="#fff" filter="url(#glow)">
    <animate attributeName="cy" values="50;150;300" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="50" r="3" fill="#fff">
    <animate attributeName="cy" values="50;110" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Friction Highlight -->
  <rect x="250" y="150" width="300" height="40" fill="none" stroke="#ff4d4d" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="600" y="165" fill="#ff4d4d" font-family="monospace" font-size="11" font-weight="bold">-24% DROPOFF DETECTED</text>
  <line x1="560" y1="160" x2="590" y2="160" stroke="#ff4d4d" stroke-width="1"/>

  <!-- Optimization Fix applied -->
  <rect x="300" y="320" width="200" height="40" rx="8" fill="#5299ff" filter="url(#glow)"/>
  <text x="400" y="345" fill="#111" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CONVERSION SECURED</text>

</svg>
