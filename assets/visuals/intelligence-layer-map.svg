<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <title>Intelligence Layer Architecture</title>
  <desc>A network map showing Jurnii UX and Jurnii 360 feeding into the central Cortex attribution layer.</desc>
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57ff60" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#141414" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="900" y1="0" x2="900" y2="600" />
  </g>

  <!-- Connective Paths -->
  <path d="M 300,200 C 500,200 500,300 700,300" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  <path d="M 300,400 C 500,400 500,300 700,300" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  
  <path d="M 300,200 C 500,200 500,300 700,300" fill="none" stroke="#57ff60" stroke-width="3" stroke-dasharray="6 8" class="signal-dash" />
  <path d="M 300,400 C 500,400 500,300 700,300" fill="none" stroke="#5299ff" stroke-width="3" stroke-dasharray="6 8" class="signal-dash" style="animation-delay: 0.5s;" />
  <path d="M 700,300 C 850,300 850,300 1000,300" fill="none" stroke="#57ff60" stroke-width="3" stroke-dasharray="6 8" class="signal-dash" />

  <!-- UX Node -->
  <g transform="translate(300, 200)">
    <circle r="40" fill="#111" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    <circle r="30" fill="url(#primaryGrad)" />
    <text x="0" y="5" font-family="monospace" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">UX</text>
  </g>

  <!-- 360 Node -->
  <g transform="translate(300, 400)">
    <circle r="40" fill="#111" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    <circle r="30" fill="rgba(82,153,255,0.2)" />
    <text x="0" y="5" font-family="monospace" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">360</text>
  </g>

  <!-- Cortex Node -->
  <g transform="translate(700, 300)">
    <rect x="-60" y="-60" width="120" height="120" rx="16" fill="#0A0A0A" stroke="#57ff60" stroke-width="2" filter="url(#glow)" />
    <text x="0" y="5" font-family="monospace" font-size="16" fill="#57ff60" text-anchor="middle" font-weight="bold">CORTEX</text>
  </g>

  <!-- Output Node -->
  <g transform="translate(1000, 300)">
    <circle r="30" fill="#111" stroke="#ffbd2e" stroke-width="2" />
    <text x="0" y="5" font-family="monospace" font-size="12" fill="#ffbd2e" text-anchor="middle" font-weight="bold">ROI</text>
  </g>
</svg>
