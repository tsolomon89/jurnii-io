<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" style="background:#0a0a0a; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08);">
  <title>Jurnii Intelligence Architecture</title>
  <desc>Data from Jurnii UX and Jurnii 360 flowing into the Cortex Engine, which outputs commercial ROI attribution.</desc>
  
  <defs>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
    <linearGradient id="uxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#2a3821" />
    </linearGradient>
    <linearGradient id="360Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#1a2538" />
    </linearGradient>
    
    <!-- Pulse animation definition since class styles won't work perfectly if embedded in img sometimes -->
    <style>
      @keyframes dashMove { to { stroke-dashoffset: -20; } }
      .signal-dash { stroke-dasharray: 6 8; animation: dashMove 1s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Paths -->
  <!-- UX to Cortex -->
  <path d="M 300 200 C 425 200 425 300 550 300" fill="none" stroke="rgba(87,255,96,0.15)" stroke-width="2" />
  <path d="M 300 200 C 425 200 425 300 550 300" fill="none" stroke="#57ff60" stroke-width="2" class="signal-dash" />
  
  <!-- 360 to Cortex -->
  <path d="M 300 400 C 425 400 425 300 550 300" fill="none" stroke="rgba(82,153,255,0.15)" stroke-width="2" />
  <path d="M 300 400 C 425 400 425 300 550 300" fill="none" stroke="#5299ff" stroke-width="2" class="signal-dash" style="animation-delay: 0.5s;" />

  <!-- Cortex to Output -->
  <path d="M 750 300 C 850 300 850 300 950 300" fill="none" stroke="rgba(255,189,46,0.15)" stroke-width="2" />
  <path d="M 750 300 C 850 300 850 300 950 300" fill="none" stroke="#ffbd2e" stroke-width="3" class="signal-dash" />

  <!-- Node: Jurnii UX -->
  <g transform="translate(100, 140)">
    <rect width="200" height="120" rx="12" fill="url(#uxGrad)" stroke="#57ff60" stroke-width="1" />
    <text x="24" y="40" font-family="monospace" font-size="16" fill="#fff" font-weight="bold">JURNII UX</text>
    <text x="24" y="68" font-family="sans-serif" font-size="14" fill="#aaa">70+ Benchmarks</text>
    <text x="24" y="90" font-family="sans-serif" font-size="14" fill="#aaa">Revenue Modeling</text>
    <circle cx="200" cy="60" r="6" fill="#57ff60" filter="url(#glowGreen)" />
  </g>

  <!-- Node: Jurnii 360 -->
  <g transform="translate(100, 340)">
    <rect width="200" height="120" rx="12" fill="url(#360Grad)" stroke="#5299ff" stroke-width="1" />
    <text x="24" y="40" font-family="monospace" font-size="16" fill="#fff" font-weight="bold">JURNII 360</text>
    <text x="24" y="68" font-family="sans-serif" font-size="14" fill="#aaa">21 Feature Areas</text>
    <text x="24" y="90" font-family="sans-serif" font-size="14" fill="#aaa">Market Activity</text>
    <circle cx="200" cy="60" r="6" fill="#5299ff" filter="url(#glowBlue)" />
  </g>

  <!-- Node: Cortex Engine -->
  <g transform="translate(550, 180)">
    <rect width="200" height="240" rx="24" fill="#050505" stroke="#333" stroke-width="1" />
    <!-- Engine Graphics -->
    <text x="100" y="46" font-family="monospace" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" letter-spacing="2">CORTEX</text>
    
    <rect x="30" y="80" width="140" height="6" rx="3" fill="#222" />
    <rect x="30" y="80" width="90" height="6" rx="3" fill="#57ff60" />
    
    <rect x="30" y="100" width="140" height="6" rx="3" fill="#222" />
    <rect x="30" y="100" width="110" height="6" rx="3" fill="#5299ff" />
    
    <circle cx="100" cy="160" r="40" fill="none" stroke="#222" stroke-width="6" />
    <path d="M 100 120 A 40 40 0 0 1 140 160" fill="none" stroke="#ffbd2e" stroke-width="6" filter="url(#glowGold)" />
    
    <text x="100" y="220" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle" text-transform="uppercase" letter-spacing="1">Processing</text>
    
    <!-- Connection Points -->
    <circle cx="0" cy="120" r="4" fill="#555" />
    <circle cx="200" cy="120" r="4" fill="#ffbd2e" filter="url(#glowGold)" />
  </g>

  <!-- Node: Commercial ROI -->
  <g transform="translate(950, 250)">
    <rect width="180" height="100" rx="12" fill="#14110A" stroke="#ffbd2e" stroke-width="1.5" />
    <text x="90" y="40" font-family="monospace" font-size="12" fill="#ffbd2e" text-anchor="middle" letter-spacing="1">CAUSAL IMPACT</text>
    <text x="90" y="76" font-family="sans-serif" font-size="36" fill="#fff" text-anchor="middle" font-weight="bold">+46% ROI</text>
  </g>
</svg>
