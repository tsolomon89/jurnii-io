<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="#0A0A0A"/>

  <!-- Bar Chart / Benchmark visualization -->
  <!-- Background rules -->
  <line x1="100" y1="300" x2="700" y2="300" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="100" y1="220" x2="700" y2="220" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="140" x2="700" y2="140" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="60" x2="700" y2="60" stroke="rgba(82,153,255,0.3)" stroke-width="1" stroke-dasharray="4 4"/>
  
  <text x="80" y="65" fill="#5299ff" font-family="monospace" font-size="10" text-anchor="end">TOP 10%</text>
  <text x="80" y="145" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" text-anchor="end">MARKET</text>
  
  <!-- Competitor Bars -->
  <rect x="150" y="160" width="40" height="140" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="250" y="120" width="40" height="180" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="350" y="190" width="40" height="110" rx="4" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Jurnii Score -->
  <rect x="450" y="80" width="40" height="220" rx="4" fill="#5299ff" filter="url(#glow)"/>
  <rect x="445" y="70" width="50" height="4" fill="#fff"/>
  <text x="470" y="55" fill="#fff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">YOUR UX</text>
  
  <rect x="550" y="140" width="40" height="160" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="650" y="210" width="40" height="90" rx="4" fill="rgba(255,255,255,0.05)"/>

  <!-- Overlay panel -->
  <rect x="560" y="50" width="200" height="80" rx="8" fill="rgba(20,20,20,0.9)" stroke="rgba(255,255,255,0.1)"/>
  <text x="580" y="75" fill="#5299ff" font-family="monospace" font-size="10">RECOMMENDED ACTION</text>
  <rect x="580" y="90" width="160" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="580" y="105" width="120" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
</svg>
