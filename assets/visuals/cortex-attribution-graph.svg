<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <title>Cortex Attribution Graph</title>
  <desc>A network map demonstrating marketing attribution modelling.</desc>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#0A0A0A" />

  <!-- Edges -->
  <g fill="none" stroke-width="2">
    <!-- From Input to Hidden 1 -->
    <path d="M 200,200 C 400,200 400,300 600,300" stroke="rgba(255,255,255,0.1)" />
    <path d="M 200,400 C 400,400 400,300 600,300" stroke="rgba(87,255,96,0.3)" class="signal-dash" />
    <path d="M 200,600 C 400,600 400,500 600,500" stroke="rgba(255,255,255,0.1)" />

    <!-- From Input to Hidden 2 -->
    <path d="M 200,200 C 400,200 400,500 600,500" stroke="rgba(255,255,255,0.1)" />
    <path d="M 200,400 C 400,400 400,500 600,500" stroke="rgba(87,255,96,0.3)" class="signal-dash" />

    <!-- From Hidden to Output -->
    <path d="M 600,300 C 800,300 800,400 1000,400" stroke="rgba(87,255,96,0.3)" class="signal-dash" />
    <path d="M 600,500 C 800,500 800,400 1000,400" stroke="rgba(255,255,255,0.1)" />
  </g>

  <!-- Nodes -->
  <g fill="#111" stroke-width="2">
    <!-- Inputs -->
    <circle cx="200" cy="200" r="16" stroke="#fff" />
    <circle cx="200" cy="400" r="16" stroke="#57ff60" filter="url(#glow)" />
    <circle cx="200" cy="600" r="16" stroke="#fff" />
    
    <!-- Hidden Layers -->
    <circle cx="600" cy="300" r="24" stroke="#57ff60" filter="url(#glow)" />
    <circle cx="600" cy="500" r="24" stroke="rgba(255,255,255,0.2)" />
    
    <!-- Output -->
    <circle cx="1000" cy="400" r="32" stroke="#57ff60" filter="url(#glow)" />
  </g>

  <!-- Labels -->
  <g font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)">
    <text x="160" y="205" text-anchor="end">Social</text>
    <text x="160" y="405" text-anchor="end" fill="#57ff60">Promos</text>
    <text x="160" y="605" text-anchor="end">Affiliates</text>
    
    <text x="600" y="260" text-anchor="middle">MMM Engine</text>
    <text x="1060" y="405" text-anchor="start" fill="#57ff60" font-size="16">Causal Impact</text>
  </g>
</svg>
