<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <title>Cortex Attribution Pipeline</title>
  <desc>Cortex Causal Marketing Mix Modelling & ROI Attribution Pipeline flow diagram.</desc>
  
  <defs>
    <!-- Dark Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(87, 255, 96, 0.15)"/>
    </pattern>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0b0b0e" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57ff60" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b7dff" stop-opacity="0" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    /* Premium Visual Design Styles */
    .bg { fill: #07070a; }
    .grid-overlay { fill: url(#techGrid); }
    
    /* Connectors & Signals */
    .pipe-line {
      stroke: rgba(255, 255, 255, 0.08);
      stroke-linecap: round;
      transition: stroke 0.3s ease;
    }
    .signal-flow {
      stroke: #57ff60;
      stroke-linecap: round;
      stroke-dasharray: 10, 15;
      animation: signalPush 4s linear infinite;
    }
    .signal-flow-blue {
      stroke: #3b7dff;
      stroke-linecap: round;
      stroke-dasharray: 10, 15;
      animation: signalPush 4s linear infinite;
    }
    
    @keyframes signalPush {
      to {
        stroke-dashoffset: -100;
      }
    }

    /* Interactive Steps */
    .step-group {
      cursor: pointer;
    }
    .step-card {
      fill: url(#cardGrad);
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1.5;
      transition: stroke 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), fill 0.3s ease, filter 0.3s ease;
    }
    .step-glow-border {
      fill: none;
      stroke: url(#glowGrad);
      stroke-width: 2.5;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .step-icon-bg {
      fill: rgba(255, 255, 255, 0.03);
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 1;
      transition: fill 0.3s ease, stroke 0.3s ease;
    }
    .step-title {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: -0.01em;
    }
    .step-desc {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11.5px;
      fill: rgba(255, 255, 255, 0.45);
      line-height: 1.5;
    }
    .step-num {
      font-family: 'Outfit', 'Inter', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 800;
      fill: var(--jurnii-500, #57ff60);
      letter-spacing: 0.1em;
    }

    /* Icon details */
    .icon-vector {
      fill: none;
      stroke: rgba(255, 255, 255, 0.6);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease;
    }

    /* Hover Interactions */
    .step-group:hover .step-card {
      stroke: rgba(87, 255, 96, 0.8);
      fill: #111116;
      filter: drop-shadow(0 12px 24px rgba(87, 255, 96, 0.08));
    }
    .step-group:hover .step-glow-border {
      opacity: 1;
    }
    .step-group:hover .step-icon-bg {
      fill: rgba(87, 255, 96, 0.08);
      stroke: rgba(87, 255, 96, 0.2);
    }
    .step-group:hover .icon-vector {
      stroke: #57ff60;
    }
    
    /* Interactive Highlight Flow paths */
    .step-group:hover ~ .pipe-line {
      stroke: rgba(87, 255, 96, 0.25);
    }

    /* Tooltips details */
    .tooltip-group {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform: translateY(10px);
    }
    .step-group:hover .tooltip-group {
      opacity: 1;
      transform: translateY(0);
    }
    .tooltip-bg {
      fill: #171722;
      stroke: rgba(87, 255, 96, 0.3);
      stroke-width: 1.5;
    }
    .tooltip-header {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #57ff60;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .tooltip-item {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px;
      fill: #fff;
    }
    .tooltip-value {
      font-family: 'monospace';
      font-size: 11px;
      fill: #57ff60;
      font-weight: 700;
    }
  </style>

  <!-- Base Layer Background -->
  <rect class="bg" width="100%" height="100%" rx="24" filter="url(#shadow)"/>
  <rect class="grid-overlay" width="100%" height="100%" rx="24"/>

  <!-- FLOW PATH CONNECTIONS -->
  <g fill="none">
    <!-- Path 1 to 2 -->
    <path class="pipe-line" d="M 280,240 Q 350,240 375,240 T 470,240" stroke-width="2.5"/>
    <path class="signal-flow" d="M 280,240 Q 350,240 375,240 T 470,240" stroke-width="2.5"/>

    <!-- Path 2 to 3 -->
    <path class="pipe-line" d="M 690,240 Q 760,240 785,240 T 880,240" stroke-width="2.5"/>
    <path class="signal-flow-blue" d="M 690,240 Q 760,240 785,240 T 880,240" stroke-width="2.5"/>

    <!-- Path 3 to 4 -->
    <path class="pipe-line" d="M 1100,240 Q 1170,240 1195,240 T 1290,240" stroke-width="2.5"/>
    <path class="signal-flow" d="M 1100,240 Q 1170,240 1195,240 T 880,240" stroke-dasharray="10,15" stroke-width="2.5" opacity="0"/>
    
    <!-- Secondary Ingestion branch lines -->
    <path class="pipe-line" d="M 30,120 Q 50,120 70,180 T 90,200" stroke-width="1.5" opacity="0.3"/>
    <path class="pipe-line" d="M 30,360 Q 50,360 70,300 T 90,280" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- STEP 1: INGESTION -->
  <g class="step-group" transform="translate(60, 110)">
    <!-- Main Card Body -->
    <rect class="step-glow-border" width="220" height="260" rx="16"/>
    <rect class="step-card" width="220" height="260" rx="16"/>
    
    <!-- Step Header -->
    <text class="step-num" x="24" y="36">STEP 01</text>
    <text class="step-title" x="24" y="60">Unified Ingestion</text>
    <text class="step-desc" x="24" y="85">Cross-channel data normalization.</text>
    <text class="step-desc" x="24" y="103">Aggregates spend across direct,</text>
    <text class="step-desc" x="24" y="121">affiliate, CRM, and promotions.</text>
    
    <!-- Icon Container -->
    <rect class="step-icon-bg" x="24" y="174" width="48" height="48" rx="10"/>
    <g transform="translate(36, 186)">
      <!-- Download/Ingest Cloud icon -->
      <path class="icon-vector" d="M12 15V3m0 12l-4-4m4 4l4-4M2 17a5 5 0 005 5h10a5 5 0 005-5"/>
    </g>
    
    <!-- Tooltip Card -->
    <g class="tooltip-group" transform="translate(0, 275)">
      <rect class="tooltip-bg" width="220" height="96" rx="12" filter="url(#shadow)"/>
      <text class="tooltip-header" x="20" y="28">Ingestion Node</text>
      <text class="tooltip-item" x="20" y="52">Sync Frequency:</text>
      <text class="tooltip-value" x="145" y="52">Real-Time</text>
      <text class="tooltip-item" x="20" y="72">Input Streams:</text>
      <text class="tooltip-value" x="145" y="72">12 Channels</text>
    </g>
  </g>

  <!-- STEP 2: CAUSAL MODELING -->
  <g class="step-group" transform="translate(470, 110)">
    <!-- Main Card Body -->
    <rect class="step-glow-border" width="220" height="260" rx="16"/>
    <rect class="step-card" width="220" height="260" rx="16"/>
    
    <!-- Step Header -->
    <text class="step-num" x="24" y="36">STEP 02</text>
    <text class="step-title" x="24" y="60">Causal Impact Modeling</text>
    <text class="step-desc" x="24" y="85">Separates organic baseline</text>
    <text class="step-desc" x="24" y="103">conversions from promotional</text>
    <text class="step-desc" x="24" y="121">lift using Bayesian analysis.</text>
    
    <!-- Icon Container -->
    <rect class="step-icon-bg" x="24" y="174" width="48" height="48" rx="10"/>
    <g transform="translate(36, 186)">
      <!-- Network Nodes icon -->
      <path class="icon-vector" d="M18 3a3 3 0 00-3 3c0 .5.1.9.3 1.3L8.6 12a3 3 0 00-3-.7c-1.7 0-3 1.3-3 3s1.3 3 3 3a3 3 0 002.8-2l6.7 4.7c-.2.4-.3.8-.3 1.3a3 3 0 006 0c0-1.7-1.3-3-3-3a3 3 0 00-2.8 2l-6.7-4.7c.2-.4.3-.8.3-1.3s-.1-.9-.3-1.3L15.4 6a3 3 0 003 .7c1.7 0 3-1.3 3-3s-1.3-3-3-3z"/>
    </g>

    <!-- Tooltip Card -->
    <g class="tooltip-group" transform="translate(0, 275)">
      <rect class="tooltip-bg" width="220" height="96" rx="12" filter="url(#shadow)"/>
      <text class="tooltip-header" x="20" y="28">Bayesian Kernel</text>
      <text class="tooltip-item" x="20" y="52">Causal Isolation:</text>
      <text class="tooltip-value" x="145" y="52">99.8% Conf.</text>
      <text class="tooltip-item" x="20" y="72">Baseline Drift:</text>
      <text class="tooltip-value" x="145" y="72">&lt; 0.02% CV</text>
    </g>
  </g>

  <!-- STEP 3: ROI ISOLATION -->
  <g class="step-group" transform="translate(880, 110)">
    <!-- Main Card Body -->
    <rect class="step-glow-border" width="220" height="260" rx="16"/>
    <rect class="step-card" width="220" height="260" rx="16"/>
    
    <!-- Step Header -->
    <text class="step-num" x="24" y="36">STEP 03</text>
    <text class="step-title" x="24" y="60">True ROI Isolation</text>
    <text class="step-desc" x="24" y="85">Eliminates double-attribution</text>
    <text class="step-desc" x="24" y="103">overlap, generating clean</text>
    <text class="step-desc" x="24" y="121">ledger outcomes in real-time.</text>
    
    <!-- Icon Container -->
    <rect class="step-icon-bg" x="24" y="174" width="48" height="48" rx="10"/>
    <g transform="translate(36, 186)">
      <!-- Target/Dollar icon -->
      <circle class="icon-vector" cx="12" cy="12" r="10"/>
      <path class="icon-vector" d="M12 6v12M9 9h4.5a2.5 2.5 0 010 5H9"/>
    </g>

    <!-- Tooltip Card -->
    <g class="tooltip-group" transform="translate(0, 275)">
      <rect class="tooltip-bg" width="220" height="96" rx="12" filter="url(#shadow)"/>
      <text class="tooltip-header" x="20" y="28">ROI Engine</text>
      <text class="tooltip-item" x="20" y="52">Average ROI Lift:</text>
      <text class="tooltip-value" x="145" y="52">+46.2%</text>
      <text class="tooltip-item" x="20" y="72">Leakage Identified:</text>
      <text class="tooltip-value" x="145" y="72">$2.4M Avg</text>
    </g>
  </g>
</svg>
