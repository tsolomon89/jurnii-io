<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <title>UX Journey Map</title>
  <desc>A journey map showing user flows with friction markers and benchmark bands.</desc>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="600" fill="#0A0A0A" />

  <!-- Benchmark Bands -->
  <rect x="100" y="100" width="1000" height="100" fill="rgba(87,255,96,0.05)" />
  <line x1="100" y1="100" x2="1100" y2="100" stroke="rgba(87,255,96,0.2)" stroke-dasharray="4 4" stroke-width="1" />
  <text x="110" y="120" font-family="monospace" font-size="12" fill="rgba(87,255,96,0.5)">Top Quartile Benchmark</text>

  <rect x="100" y="400" width="1000" height="100" fill="rgba(255,77,77,0.05)" />
  <line x1="100" y1="500" x2="1100" y2="500" stroke="rgba(255,77,77,0.2)" stroke-dasharray="4 4" stroke-width="1" />
  <text x="110" y="490" font-family="monospace" font-size="12" fill="rgba(255,77,77,0.5)">Risk Zone</text>

  <!-- Journey Path -->
  <path d="M 100,250 C 300,250 400,150 500,150 C 600,150 700,450 800,450 C 900,450 1000,250 1100,250" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />
  
  <path d="M 100,250 C 300,250 400,150 500,150" fill="none" stroke="#57ff60" stroke-width="4" filter="url(#glow)" />
  <path d="M 500,150 C 600,150 700,450 800,450" fill="none" stroke="#ff4d4d" stroke-width="4" filter="url(#glow)" />
  <path d="M 800,450 C 900,450 1000,250 1100,250" fill="none" stroke="#5299ff" stroke-width="4" filter="url(#glow)" />

  <!-- Nodes -->
  <circle cx="100" cy="250" r="8" fill="#111" stroke="#57ff60" stroke-width="2" />
  <circle cx="500" cy="150" r="12" fill="#111" stroke="#57ff60" stroke-width="3" />
  <circle cx="800" cy="450" r="16" fill="#111" stroke="#ff4d4d" stroke-width="4" />
  <circle cx="1100" cy="250" r="8" fill="#111" stroke="#5299ff" stroke-width="2" />

  <!-- Annotation -->
  <g transform="translate(750, 500)">
    <rect x="0" y="0" width="140" height="40" rx="4" fill="rgba(255,77,77,0.1)" stroke="rgba(255,77,77,0.3)" stroke-width="1" />
    <text x="70" y="24" font-family="monospace" font-size="12" fill="#ff4d4d" text-anchor="middle">KYC Friction</text>
  </g>

</svg>
