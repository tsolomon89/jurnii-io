<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <title>Conversion Flow Map</title>
  <desc>A flow map showing the conversion pipeline with friction nodes.</desc>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="#0A0A0A" />

  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
  </g>

  <!-- Funnel Base Paths -->
  <path d="M 150,200 L 450,200 L 750,200 L 1050,200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8" />

  <!-- Optimal Path -->
  <path d="M 150,200 L 450,200" fill="none" stroke="#57ff60" stroke-width="4" filter="url(#glow)" />
  <path d="M 450,200 C 600,200 600,300 750,300" fill="none" stroke="#ff4d4d" stroke-width="4" stroke-dasharray="4 4" filter="url(#glow)" />
  <path d="M 450,200 C 600,200 600,100 750,100" fill="none" stroke="#57ff60" stroke-width="4" class="signal-dash" filter="url(#glow)" />
  <path d="M 750,100 C 900,100 900,200 1050,200" fill="none" stroke="#57ff60" stroke-width="4" filter="url(#glow)" />

  <!-- Nodes -->
  <g fill="#111" stroke-width="2">
    <circle cx="150" cy="200" r="16" stroke="#fff" />
    <circle cx="450" cy="200" r="16" stroke="#57ff60" />
    <circle cx="750" cy="300" r="16" stroke="#ff4d4d" />
    <circle cx="750" cy="100" r="16" stroke="#57ff60" />
    <circle cx="1050" cy="200" r="16" stroke="#57ff60" />
  </g>

  <!-- Labels -->
  <g font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)">
    <text x="150" y="240" text-anchor="middle">Click</text>
    <text x="450" y="240" text-anchor="middle">Reg Start</text>
    <text x="750" y="340" text-anchor="middle" fill="#ff4d4d">Friction / Drop-off</text>
    <text x="750" y="70" text-anchor="middle" fill="#57ff60">Optimised Flow</text>
    <text x="1050" y="240" text-anchor="middle">Deposit</text>
  </g>
</svg>
