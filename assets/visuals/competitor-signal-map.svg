<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <title>Competitor Signal Map</title>
  <desc>A grid map showing competitor movement signals.</desc>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#0A0A0A" />

  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="900" y1="0" x2="900" y2="800" />
    
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Signal Paths -->
  <path d="M 300,400 L 600,200" fill="none" stroke="#57ff60" stroke-width="3" stroke-dasharray="6 8" class="signal-dash" filter="url(#glow)" />
  <path d="M 600,200 L 900,400" fill="none" stroke="#57ff60" stroke-width="3" stroke-dasharray="6 8" class="signal-dash" filter="url(#glow)" />
  <path d="M 300,400 L 600,600" fill="none" stroke="#ffbd2e" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Nodes -->
  <g fill="#111" stroke-width="2">
    <rect x="280" y="380" width="40" height="40" rx="8" stroke="rgba(255,255,255,0.2)" />
    <rect x="580" y="180" width="40" height="40" rx="8" stroke="#57ff60" filter="url(#glow)" />
    <rect x="580" y="580" width="40" height="40" rx="8" stroke="#ffbd2e" />
    <rect x="880" y="380" width="40" height="40" rx="8" stroke="rgba(255,255,255,0.2)" />
  </g>

  <!-- Labels -->
  <g font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">
    <text x="300" y="440">Competitor A</text>
    <text x="600" y="160" fill="#57ff60">Competitor Z Alert</text>
    <text x="600" y="640">Competitor B</text>
    <text x="900" y="440">Market Trend</text>
  </g>
</svg>
