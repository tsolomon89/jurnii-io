<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <title>Commercial Radar</title>
  <desc>A sweeping radar visualization tracking competitor promotions.</desc>
  <defs>
    <radialGradient id="radarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#141414" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#radarGrad)" />

  <!-- Radar Rings -->
  <g stroke="rgba(87,255,96,0.1)" stroke-width="2" fill="none">
    <circle cx="500" cy="500" r="100" />
    <circle cx="500" cy="500" r="200" />
    <circle cx="500" cy="500" r="300" />
    <circle cx="500" cy="500" r="400" />
  </g>

  <!-- Crosshairs -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="500" y1="0" x2="500" y2="1000" />
    <line x1="0" y1="500" x2="1000" y2="500" />
  </g>

  <!-- Targets -->
  <circle cx="300" cy="300" r="8" fill="#57ff60" filter="url(#glow)" />
  <circle cx="700" cy="200" r="12" fill="#5299ff" filter="url(#glow)" />
  <circle cx="400" cy="700" r="6" fill="#ffbd2e" filter="url(#glow)" />
  <circle cx="800" cy="600" r="10" fill="#57ff60" filter="url(#glow)" />

  <!-- Radar Sweep Cone (Static representation for SVG background) -->
  <path d="M 500,500 L 500,100 A 400 400 0 0 1 800,226 Z" fill="rgba(87,255,96,0.05)" />
</svg>
