<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <title>Jurnii 360 Commercial Radar</title>
  <desc>Futuristic sweeping radar visualization monitoring competitor promo campaigns and UX changes in real-time.</desc>

  <defs>
    <!-- Dark Radar Background Gradient -->
    <radialGradient id="radarDarkBg" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#07070a" />
      <stop offset="100%" stop-color="#0f0f15" />
    </radialGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57ff60" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#57ff60" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#57ff60" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="blipGlowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="blipGlowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="blipGlowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    /* CSS Styles for Interactive Radar Visuals */
    .radar-bg { fill: url(#radarDarkBg); }
    
    /* Sweeping Beam Animation */
    .radar-beam {
      fill: url(#sweepGrad);
      transform-origin: 400px 400px;
      animation: sweepRotary 6s linear infinite;
    }
    
    @keyframes sweepRotary {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Polar Grid Guides */
    .polar-circle {
      fill: none;
      stroke: rgba(87, 255, 96, 0.08);
      stroke-width: 1.5;
      stroke-dasharray: 4, 6;
      transition: stroke 0.3s ease;
    }
    .polar-circle-bold {
      fill: none;
      stroke: rgba(87, 255, 96, 0.15);
      stroke-width: 2;
      transition: stroke 0.3s ease;
    }
    .grid-line {
      stroke: rgba(255, 255, 255, 0.03);
      stroke-width: 1;
    }
    .axis-label {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 700;
      fill: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* Blips and Actions */
    .blip-group {
      cursor: pointer;
    }
    .blip-core {
      stroke-width: 3;
      transition: r 0.2s ease, stroke-width 0.2s ease;
    }
    .blip-pulse {
      fill: none;
      stroke-width: 1.5;
      animation: pulseRipple 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    @keyframes pulseRipple {
      0% { r: 6px; opacity: 1; }
      100% { r: 24px; opacity: 0; }
    }

    /* Operator Color Variants */
    .blip-green .blip-core { fill: #57ff60; stroke: rgba(87, 255, 96, 0.4); filter: url(#blipGlowGreen); }
    .blip-green .blip-pulse { stroke: #57ff60; }
    .blip-blue .blip-core { fill: #3b7dff; stroke: rgba(59, 125, 255, 0.4); filter: url(#blipGlowBlue); }
    .blip-blue .blip-pulse { stroke: #3b7dff; }
    .blip-orange .blip-core { fill: #ff9f1a; stroke: rgba(255, 159, 26, 0.4); filter: url(#blipGlowOrange); }
    .blip-orange .blip-pulse { stroke: #ff9f1a; }

    /* Tooltip/Card Panel Styles */
    .operator-card {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95) translate(-10px, -10px);
      transform-origin: 50% 50%;
      transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .blip-group:hover .operator-card {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translate(0, 0);
    }

    .card-base {
      fill: #111116;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1.5;
    }
    .blip-group:hover .card-base {
      stroke: rgba(87, 255, 96, 0.4);
    }
    .card-label {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .card-title {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
    }
    .card-desc {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px;
      fill: rgba(255, 255, 255, 0.5);
    }
    .card-metric-label {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      fill: rgba(255, 255, 255, 0.4);
    }
    .card-metric-val {
      font-family: 'monospace';
      font-size: 11.5px;
      fill: #57ff60;
      font-weight: 700;
    }

    /* Rings Details Text */
    .ring-label {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      font-weight: 700;
      fill: rgba(255, 255, 255, 0.15);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
  </style>

  <!-- Base Space Background -->
  <rect class="radar-bg" width="100%" height="100%" rx="24" filter="url(#cardShadow)"/>

  <!-- Radar Coordinates & Axis Guides -->
  <g>
    <!-- Axis lines -->
    <line class="grid-line" x1="400" y1="50" x2="400" y2="750" />
    <line class="grid-line" x1="50" y1="400" x2="750" y2="400" />
    <line class="grid-line" x1="152" y1="152" x2="648" y2="648" />
    <line class="grid-line" x1="152" y1="648" x2="648" y2="152" />

    <!-- Concentric radar circles -->
    <circle class="polar-circle" cx="400" cy="400" r="80" />
    <circle class="polar-circle" cx="400" cy="400" r="170" />
    <circle class="polar-circle" cx="400" cy="400" r="260" />
    <circle class="polar-circle-bold" cx="400" cy="400" r="350" />
  </g>

  <!-- Radar Sector Labels -->
  <g>
    <text class="axis-label" x="400" y="36" text-anchor="middle">000° Offers</text>
    <text class="axis-label" x="765" y="404" text-anchor="start">090° Timing</text>
    <text class="axis-label" x="400" y="776" text-anchor="middle">180° Channels</text>
    <text class="axis-label" x="35" y="404" text-anchor="end">270° UX Check</text>
  </g>

  <!-- Concentric Rings Labels -->
  <g>
    <text class="ring-label" x="408" y="315">Zone A: Pricing</text>
    <text class="ring-label" x="408" y="225">Zone B: Homepage</text>
    <text class="ring-label" x="408" y="135">Zone C: Channels</text>
  </g>

  <!-- THE ROTATING SWEEP BEAM -->
  <path class="radar-beam" d="M 400,400 L 400,50 A 350 350 0 0 1 647,152 Z" />

  <!-- RADAR BLIP 1: BET365 (GREEN) - Zone A (Offers) -->
  <g class="blip-group blip-green" transform="translate(0, 0)">
    <circle class="blip-pulse" cx="420" cy="300" r="6" />
    <circle class="blip-core" cx="420" cy="300" r="7" />
    
    <!-- Operator Card Tooltip -->
    <g class="operator-card" transform="translate(435, 190)">
      <rect class="card-base" width="220" height="110" rx="12" filter="url(#cardShadow)"/>
      <text class="card-label" x="16" y="24" fill="#57ff60">Bet365 (iGaming)</text>
      <text class="card-title" x="16" y="44">Super Boost: +150%</text>
      <text class="card-desc" x="16" y="64">Odds boost promo on weekend UCL.</text>
      
      <text class="card-metric-label" x="16" y="88">Generosity Index:</text>
      <text class="card-metric-val" x="140" y="88">88/100</text>
    </g>
  </g>

  <!-- RADAR BLIP 2: SKYBET (BLUE) - Zone B (Homepage Banners) -->
  <g class="blip-group blip-blue" transform="translate(0, 0)">
    <circle class="blip-pulse" cx="540" cy="270" r="6" />
    <circle class="blip-core" cx="540" cy="270" r="7" />
    
    <!-- Operator Card Tooltip -->
    <g class="operator-card" transform="translate(555, 160)">
      <rect class="card-base" width="220" height="110" rx="12" filter="url(#cardShadow)"/>
      <text class="card-label" x="16" y="24" fill="#3b7dff">SkyBet (Sectors)</text>
      <text class="card-title" x="16" y="44">Free Bet Drop Live</text>
      <text class="card-desc" x="16" y="64">Shifted prime banner spot to slots.</text>
      
      <text class="card-metric-label" x="16" y="88">Margin Exposure:</text>
      <text class="card-metric-val" x="140" y="88">High Risk</text>
    </g>
  </g>

  <!-- RADAR BLIP 3: DRAFTKINGS (ORANGE) - Zone C (UX Checkout) -->
  <g class="blip-group blip-orange" transform="translate(0, 0)">
    <circle class="blip-pulse" cx="240" cy="480" r="6" />
    <circle class="blip-core" cx="240" cy="480" r="7" />
    
    <!-- Operator Card Tooltip -->
    <g class="operator-card" transform="translate(255, 370)">
      <rect class="card-base" width="220" height="110" rx="12" filter="url(#cardShadow)"/>
      <text class="card-label" x="16" y="24" fill="#ff9f1a">DraftKings (Enterprise)</text>
      <text class="card-title" x="16" y="44">KYC Checkout Audit</text>
      <text class="card-desc" x="16" y="64">Optimized card scanning flow.</text>
      
      <text class="card-metric-label" x="16" y="88">Friction Reduction:</text>
      <text class="card-metric-val" x="140" y="88">-14.2s</text>
    </g>
  </g>
</svg>
