<div class="interface-artifact float-slow">
  <div class="artifact-browser-frame" style="max-width: 900px; margin: 0 auto; height: 500px;">
    
    <div class="artifact-window-bar">
      <div class="dots">
        <span style="background: #ff5f56;"></span>
        <span style="background: #ffbd2e;"></span>
        <span style="background: #27c93f;"></span>
      </div>
      <div class="title">intelligence.jurnii.io/competitor-intelligence</div>
    </div>

    <div class="artifact-window">
      <div class="artifact-sidebar">
        <div class="ico" style="color: var(--jurnii-500);"><i data-lucide="shield-alert"></i></div>
      </div>

      <div class="artifact-canvas">
        <div class="artifact-grid-bg"></div>
        <img src="../images/generated/jurnii-360-commercial-radar.webp" alt="Competitor Atmospheric Layer" style="filter: grayscale(0.5);">
        
        <!-- SVG Competitor Grid Map -->
        <svg class="artifact-path-layer" viewBox="0 0 800 400" preserveAspectRatio="none">
          <line x1="200" y1="0" x2="200" y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
          <line x1="400" y1="0" x2="400" y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
          <line x1="600" y1="0" x2="600" y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
          
          <line x1="0" y1="100" x2="800" y2="100" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
          <line x1="0" y1="200" x2="800" y2="200" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
          <line x1="0" y1="300" x2="800" y2="300" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

          <!-- Signal paths -->
          <path d="M 200,200 L 400,100" fill="none" stroke="rgba(87,255,96,0.3)" stroke-width="2" class="signal-dash" />
          <path d="M 400,100 L 600,200" fill="none" stroke="rgba(87,255,96,0.3)" stroke-width="2" class="signal-dash" />
        </svg>

        <!-- Market Shift Warning -->
        <div class="artifact-glass artifact-alert-card float-fast" style="top: 60px; left: 100px; width: 180px;">
          <span style="font-family: var(--font-mono); font-size: 11px; color: #ff4d4d; display: block; margin-bottom: 4px;">Competitor Shift</span>
          <span style="font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.7);">Brand Z increased sign-up offer</span>
        </div>

        <!-- Competitor Nodes -->
        <div class="artifact-node float-medium" style="top: 170px; left: 170px; width: 40px; height: 40px; background: rgba(255,255,255,0.05);">A</div>
        <div class="artifact-node artifact-node-primary float-slow" style="top: 70px; left: 370px; width: 40px; height: 40px;">Z</div>
        <div class="artifact-node float-medium" style="top: 170px; left: 570px; width: 40px; height: 40px; background: rgba(255,255,255,0.05);">B</div>

        <!-- Tracked Operators Strip -->
        <div style="position: absolute; bottom: 40px; left: 40px; right: 40px; display: flex; gap: 16px;">
          <div class="artifact-glass" style="flex: 1; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;">
             <span style="font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,0.5);">Offers Tracking</span>
             <span class="artifact-chip">Live</span>
          </div>
          <div class="artifact-glass" style="flex: 1; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;">
             <span style="font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,0.5);">Banners Tracking</span>
             <span class="artifact-chip">Live</span>
          </div>
          <div class="artifact-glass" style="flex: 1; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;">
             <span style="font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,0.5);">Trends Tracking</span>
             <span class="artifact-chip">Live</span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
