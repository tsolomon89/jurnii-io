<div class="interface-artifact float-slow">
  <div class="artifact-browser-frame" style="max-width: 900px; margin: 0 auto; height: 500px;">
    
    <!-- Browser/Window Header -->
    <div class="artifact-window-bar">
      <div class="dots">
        <span style="background: #ff5f56;"></span>
        <span style="background: #ffbd2e;"></span>
        <span style="background: #27c93f;"></span>
      </div>
      <div class="title">intelligence.jurnii.io/layer</div>
    </div>

    <!-- Window Body -->
    <div class="artifact-window">
      <!-- Sidebar Navigation -->
      <div class="artifact-sidebar">
        <div class="ico" style="color: var(--jurnii-500);"><i data-lucide="layout-template"></i></div>
        <div class="ico"><i data-lucide="radar"></i></div>
        <div class="ico"><i data-lucide="network"></i></div>
      </div>

      <!-- Main Canvas -->
      <div class="artifact-canvas">
        <div class="artifact-grid-bg"></div>
        <img src="../images/generated/jurnii-intelligence-layer-hero.webp" alt="Atmospheric Layer">
        
        <!-- SVG Signal Paths Layer -->
        <svg class="artifact-path-layer" viewBox="0 0 800 400" preserveAspectRatio="none">
          <path d="M 200,100 C 350,100 350,200 600,200" fill="none" stroke="rgba(87,255,96,0.3)" stroke-width="2" class="signal-dash" />
          <path d="M 200,300 C 350,300 350,200 600,200" fill="none" stroke="rgba(82,153,255,0.3)" stroke-width="2" class="signal-dash" style="animation-delay: 0.5s;" />
        </svg>

        <!-- Product Nodes -->
        <div class="artifact-node float-fast" style="top: 80px; left: 150px;">UX</div>
        <div class="artifact-node float-medium" style="top: 280px; left: 150px;">360</div>
        <div class="artifact-node artifact-node-primary float-slow" style="top: 180px; left: 580px; width: 80px; height: 80px;">CORTEX</div>

        <!-- Floating Info Cards -->
        <div class="artifact-glass artifact-floating-card float-medium" style="top: 40px; left: 240px;">
          <span class="artifact-metric">300+<span>brands</span></span>
          <div class="artifact-chip">Commercial signal</div>
        </div>

        <div class="artifact-glass artifact-floating-card float-fast" style="bottom: 60px; left: 240px;">
          <span class="artifact-metric">1,000+<span>offers</span></span>
          <div class="artifact-chip" style="color: #5299ff; background: rgba(82,153,255,0.1); border-color: rgba(82,153,255,0.2);">Market movement</div>
        </div>

        <div class="artifact-glass artifact-success-card float-slow" style="top: 100px; right: 40px;">
          <span class="artifact-metric" style="font-size: 16px;">Attribution model</span>
          <span style="font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,0.5);">Converging intelligence</span>
        </div>
      </div>
    </div>
  </div>
</div>
