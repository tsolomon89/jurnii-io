<div class="interface-artifact float-slow">
  <div class="artifact-browser-frame" style="max-width: 900px; margin: 0 auto; height: 500px;">
    
    <div class="artifact-window-bar">
      <div class="dots">
        <span style="background: #ff5f56;"></span>
        <span style="background: #ffbd2e;"></span>
        <span style="background: #27c93f;"></span>
      </div>
      <div class="title">intelligence.jurnii.io/cortex-attribution</div>
    </div>

    <div class="artifact-window">
      <div class="artifact-sidebar">
        <div class="ico" style="color: var(--jurnii-500);"><i data-lucide="network"></i></div>
      </div>

      <div class="artifact-canvas">
        <div class="artifact-grid-bg"></div>
        <img src="../images/generated/cortex-attribution-interface.webp" alt="Attribution Atmospheric Layer">
        
        <!-- SVG Attribution Node Graph -->
        <svg class="artifact-path-layer" viewBox="0 0 800 400" preserveAspectRatio="none">
          <path d="M 150,100 C 300,100 400,200 600,200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
          <path d="M 150,200 C 300,200 400,200 600,200" fill="none" stroke="rgba(87,255,96,0.3)" stroke-width="3" class="signal-dash" />
          <path d="M 150,300 C 300,300 400,200 600,200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
        </svg>

        <!-- Channel Input Cards -->
        <div style="position: absolute; top: 80px; left: 40px; display: flex; flex-direction: column; gap: 60px;">
           <div class="artifact-glass" style="padding: 8px 16px; border-radius: 20px; font-family: var(--font-mono); font-size: 11px; color: #fff;">Social Spend</div>
           <div class="artifact-glass" style="padding: 8px 16px; border-radius: 20px; font-family: var(--font-mono); font-size: 11px; color: var(--jurnii-500); border-color: var(--jurnii-500);">Promo Mechanics</div>
           <div class="artifact-glass" style="padding: 8px 16px; border-radius: 20px; font-family: var(--font-mono); font-size: 11px; color: #fff;">Affiliates</div>
        </div>

        <!-- Central Model Layer -->
        <div class="artifact-glass float-medium" style="position: absolute; top: 120px; left: 350px; width: 120px; height: 160px; display: flex; align-items: center; justify-content: center; flex-direction: column; border-color: rgba(87,255,96,0.3); background: rgba(20,20,20,0.8);">
           <i data-lucide="calculator" style="color: var(--jurnii-500); margin-bottom: 8px;"></i>
           <span style="font-family: var(--font-mono); font-size: 11px; color: #fff;">MMM Core</span>
        </div>

        <!-- Outcome Card -->
        <div class="artifact-glass artifact-success-card float-fast" style="top: 150px; right: 40px; width: 200px;">
          <span style="font-family: var(--font-mono); font-size: 11px; color: var(--jurnii-500); display: block; margin-bottom: 4px;">Causal Impact</span>
          <span class="artifact-metric" style="font-size: 24px; margin-bottom: 4px;">+46%</span>
          <span style="font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.5);">True ROI validated</span>
        </div>

        <!-- Scenario Branch Card -->
        <div class="artifact-glass float-slow" style="position: absolute; bottom: 40px; right: 40px; padding: 12px 16px; display: flex; align-items: center; gap: 8px;">
          <div class="artifact-chip" style="color: #fff; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2);">Scenario Plan</div>
          <span style="font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,0.7);">Reallocating 15% budget</span>
        </div>

      </div>
    </div>
