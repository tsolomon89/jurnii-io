<div class="interface-artifact float-slow">
  <div class="artifact-browser-frame" style="max-width: 900px; margin: 0 auto; height: 500px;">
    
    <!-- Browser Header -->
    <div class="artifact-window-bar">
      <div class="dots">
        <span style="background: #ff5f56;"></span>
        <span style="background: #ffbd2e;"></span>
        <span style="background: #27c93f;"></span>
      </div>
      <div class="title">intelligence.jurnii.io/ux-benchmarking</div>
    </div>

    <!-- Window Body -->
    <div class="artifact-window">
      <!-- Sidebar Navigation -->
      <div class="artifact-sidebar">
        <div class="ico" style="color: var(--jurnii-500);"><i data-lucide="layout-template"></i></div>
      </div>

      <!-- Main Canvas -->
      <div class="artifact-canvas">
        <div class="artifact-grid-bg"></div>
        <img src="../images/generated/jurnii-ux-interface.webp" alt="UX Atmospheric Layer">
        
        <!-- SVG Journey Path Layer -->
        <svg class="artifact-path-layer" viewBox="0 0 800 400" preserveAspectRatio="none">
          <path d="M 100,200 L 700,200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
          <path d="M 100,200 L 400,200" fill="none" stroke="var(--jurnii-500)" stroke-width="3" class="signal-dash" />
          <circle cx="250" cy="200" r="6" fill="#111" stroke="var(--jurnii-500)" stroke-width="2" />
          <circle cx="400" cy="200" r="8" fill="#111" stroke="#ff4d4d" stroke-width="2" class="pulse-soft" />
        </svg>

        <!-- Benchmark Comparison Bands -->
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
           <div style="position: absolute; top: 120px; left: 100px; right: 100px; height: 40px; background: rgba(87,255,96,0.05); border-top: 1px dashed rgba(87,255,96,0.2);"></div>
           <div style="position: absolute; top: 240px; left: 100px; right: 100px; height: 40px; background: rgba(255,77,77,0.05); border-bottom: 1px dashed rgba(255,77,77,0.2);"></div>
        </div>

        <!-- Floating Dimension Panels -->
        <div class="artifact-glass artifact-floating-card float-medium" style="top: 40px; left: 80px; width: 140px;">
          <div class="artifact-chip" style="margin-bottom: 8px;">Journeys</div>
          <div style="height: 4px; width: 100%; background: #222; border-radius: 2px;"><div style="height: 100%; width: 85%; background: var(--jurnii-500); border-radius: 2px;"></div></div>
        </div>
        
        <div class="artifact-glass artifact-floating-card float-slow" style="top: 40px; left: 240px; width: 140px;">
          <div class="artifact-chip" style="margin-bottom: 8px; color: #5299ff; background: rgba(82,153,255,0.1); border-color: rgba(82,153,255,0.2);">Usability</div>
          <div style="height: 4px; width: 100%; background: #222; border-radius: 2px;"><div style="height: 100%; width: 70%; background: #5299ff; border-radius: 2px;"></div></div>
        </div>

        <!-- Friction Marker Card -->
        <div class="artifact-glass artifact-alert-card float-fast" style="top: 140px; left: 350px;">
          <span style="font-family: var(--font-mono); font-size: 11px; color: #ff4d4d; display: block; margin-bottom: 4px;">Friction Detected</span>
          <span class="artifact-metric" style="font-size: 14px; margin-bottom: 0;">Registration Drop-off</span>
        </div>

        <!-- Ranked Recommendation Stack -->
        <div style="position: absolute; bottom: 40px; right: 40px; width: 260px; display: flex; flex-direction: column; gap: 8px;">
          <div class="artifact-glass" style="padding: 12px; display: flex; justify-content: space-between; align-items: center;">
             <span style="font-family: var(--font-mono); font-size: 11px; color: #fff;">1. Simplify deposit UI</span>
             <span class="artifact-chip">High Impact</span>
          </div>
          <div class="artifact-glass" style="padding: 12px; display: flex; justify-content: space-between; align-items: center; opacity: 0.7;">
             <span style="font-family: var(--font-mono); font-size: 11px; color: #fff;">2. Tooltip visibility</span>
             <span class="artifact-chip" style="color: #fff; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2);">Med Impact</span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
