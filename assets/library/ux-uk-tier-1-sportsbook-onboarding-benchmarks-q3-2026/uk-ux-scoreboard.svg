  <!-- Benchmark average line (57.0) -->
  <!-- 200px offset + (57.0 * 4.0px) = 428px -->
  <line x1="428" y1="100" x2="428" y2="370" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <text x="434" y="112" fill="#38bdf8" font-size="11" font-weight="600">Cohort Mean: 57.0</text>

  <!-- Row 1: Midnite (78) -->
  <text x="40" y="145" fill="#f8fafc" font-size="14" font-weight="600">1. Midnite</text>
  <rect x="200" y="128" width="312" height="26" rx="4" fill="url(#barMidnite)"/>
  <text x="522" y="146" fill="#38bdf8" font-size="14" font-weight="700">78</text>
  <text x="560" y="146" fill="#94a3b8" font-size="12">Perf: 87 · Usability: 78 · Journey: 70 · Percept: 79</text>

  <!-- Row 2: Paddy Power (60) -->
  <text x="40" y="195" fill="#cbd5e1" font-size="14">2. Paddy Power</text>
  <rect x="200" y="178" width="240" height="26" rx="4" fill="url(#barDefault)"/>
  <text x="450" y="196" fill="#f8fafc" font-size="14" font-weight="600">60</text>
  <text x="560" y="196" fill="#94a3b8" font-size="12">Perf: 35 · Usability: 72 · Journey: 67 · Percept: 63</text>

  <!-- Row 3: SkyCasino (54) -->
  <text x="40" y="245" fill="#cbd5e1" font-size="14">3. SkyCasino</text>
  <rect x="200" y="228" width="216" height="26" rx="4" fill="url(#barDefault)"/>
  <text x="426" y="246" fill="#f8fafc" font-size="14" font-weight="600">54</text>
  <text x="560" y="246" fill="#94a3b8" font-size="12">Perf: 44 · Usability: 71 · Journey: 65 · Percept: 38</text>

  <!-- Row 4: William Hill (49) -->
  <text x="40" y="295" fill="#cbd5e1" font-size="14">4. William Hill</text>
  <rect x="200" y="278" width="196" height="26" rx="4" fill="url(#barDefault)"/>
  <text x="406" y="296" fill="#f8fafc" font-size="14" font-weight="600">49</text>
  <text x="560" y="296" fill="#94a3b8" font-size="12">Perf: 34 · Usability: 73 · Journey: 75 · Percept: 16</text>

  <!-- Row 5: Ladbrokes (44) -->
  <text x="40" y="345" fill="#ef4444" font-size="14">5. Ladbrokes</text>
  <rect x="200" y="328" width="176" height="26" rx="4" fill="url(#barLadb)"/>
  <text x="386" y="346" fill="#ef4444" font-size="14" font-weight="700">44</text>
  <text x="560" y="346" fill="#94a3b8" font-size="12">Perf: 45 · Usability: 68 · Journey: 57 · Percept: 15</text>

  <!-- Footer note -->
  <text x="40" y="405" fill="#64748b" font-size="11">Source: Jurnii UX Platform (app.jurnii.io) · Expert UX Audits (Performance, Usability, Journey, Perception)</text>
</svg>
