<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="auto" style="background:#070a12; font-family:Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <radialGradient id="glow360" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandLine360" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#070a12"/>
  <rect width="1200" height="630" fill="url(#glow360)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Lens Badge -->
  <rect x="80" y="80" width="160" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="98" cy="96" r="5" fill="#38bdf8"/>
  <text x="112" y="101" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">JURNII 360</text>

  <!-- Format Badge -->
  <rect x="250" y="80" width="130" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="268" y="101" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">FULL MARKET</text>

  <!-- Title -->
  <text x="80" y="185" fill="#f8fafc" font-size="44" font-weight="800" letter-spacing="-0.5">UK Sportsbook Promotional</text>
  <text x="80" y="240" fill="#f8fafc" font-size="44" font-weight="800" letter-spacing="-0.5">Intensity &amp; Generosity</text>

  <!-- Subtitle -->
  <text x="80" y="295" fill="#94a3b8" font-size="20" font-weight="400">Promotional volume, boost mechanics, and richness across 24 regulated operators</text>

  <!-- Decorative Metric Strip -->
  <g transform="translate(80, 360)">
    <rect width="240" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="32" fill="#64748b" font-size="11" font-weight="600">MARKET VALUE</text>
    <text x="20" y="64" fill="#38bdf8" font-size="26" font-weight="700">£26.8M</text>

    <rect x="260" width="240" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="280" y="32" fill="#64748b" font-size="11" font-weight="600">ACTIVE BOOSTS</text>
    <text x="280" y="64" fill="#f8fafc" font-size="26" font-weight="700">1,117</text>

    <rect x="520" width="240" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="540" y="32" fill="#64748b" font-size="11" font-weight="600">RICHNESS INDEX</text>
    <text x="540" y="64" fill="#818cf8" font-size="26" font-weight="700">3,288.5%</text>

    <rect x="780" width="240" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="800" y="32" fill="#64748b" font-size="11" font-weight="600">BOOST CONCENTRATION</text>
    <text x="800" y="64" fill="#f87171" font-size="26" font-weight="700">71.3% Top 3</text>
  </g>

  <!-- Brand Accent Bar -->
  <rect x="80" y="520" width="1040" height="3" fill="url(#brandLine360)"/>

  <!-- Footer Metadata -->
  <text x="80" y="560" fill="#64748b" font-size="13">Q3 2026 · Source: Jurnii 360 · UK Market Coverage Live Feed &amp; Boost Telemetry</text>
  <text x="1120" y="560" fill="#64748b" font-size="13" text-anchor="end">Jurnii Commercial Intelligence</text>
