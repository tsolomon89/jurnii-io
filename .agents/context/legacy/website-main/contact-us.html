<html data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Jurnii</title>
<meta name="description" content="Send the Jurnii team a message. We reply within one working day.">
<link rel="icon" href="assets/jurnii-icon-light.svg">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preload" href="assets/fonts/Geist-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/global.css">
<link rel="stylesheet" href="assets/fonts-mono.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="assets/fonts-mono.css"></noscript>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/lucide@1.25.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="assets/site.jsx"></script>
<script type="text/babel" src="assets/blocks.jsx"></script>
<script type="text/babel">

const { useState: cuS } = React;

const CONTACT_STORE_KEY = 'jurnii_contact_messages';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function recordSubmission(data) {
  try {
    const prev = JSON.parse(localStorage.getItem(CONTACT_STORE_KEY) || '[]');
    prev.push({ ...data, submittedAt: new Date().toISOString() });
    localStorage.setItem(CONTACT_STORE_KEY, JSON.stringify(prev));
    return true;
  } catch (e) {
    return false;
  }
}

const FIELDS = [
{ name: 'firstName', label: 'First name', placeholder: 'Fraser', half: true },
{ name: 'lastName', label: 'Last name', placeholder: 'Davidson', half: true },
{ name: 'email', label: 'Email address', placeholder: 'you@operator.com', type: 'email' },
{ name: 'company', label: 'Company', placeholder: 'Operator name' }];

function validate(values) {
  const errors = {};
  if (!values.firstName.trim()) errors.firstName = 'First name is required.';
  if (!values.lastName.trim()) errors.lastName = 'Last name is required.';
  if (!values.email.trim()) errors.email = 'Email address is required.';else
  if (!EMAIL_RE.test(values.email.trim())) errors.email = 'Enter a valid email address.';
  if (!values.company.trim()) errors.company = 'Company is required.';
  if (!values.message.trim()) errors.message = 'Please add a message.';else
  if (values.message.trim().length < 10) errors.message = 'Message is a little short — add a few more details.';
  return errors;
}

const EMPTY = { firstName: '', lastName: '', email: '', company: '', message: '' };

function MessageForm() {
  const [values, setValues] = cuS(EMPTY);
  const [errors, setErrors] = cuS({});
  const [touched, setTouched] = cuS({});
  const [status, setStatus] = cuS(null); // {type:'success'|'error', msg}

  React.useEffect(() => {window.lucide && window.lucide.createIcons();}, [status, errors]);

  const setField = (name, val) => {
    setValues((v) => ({ ...v, [name]: val }));
    if (touched[name]) {
      setErrors(validate({ ...values, [name]: val }));
    }
  };
  const onBlur = (name) => {
    setTouched((t) => ({ ...t, [name]: true }));
    setErrors(validate(values));
  };

  const onSubmit = (e) => {
    e.preventDefault();
    const errs = validate(values);
    setErrors(errs);
    setTouched({ firstName: true, lastName: true, email: true, company: true, message: true });
    if (Object.keys(errs).length > 0) {
      setStatus({ type: 'error', msg: 'Please fix the highlighted fields and try again.' });
      return;
    }
    const saved = recordSubmission({
      firstName: values.firstName.trim(),
      lastName: values.lastName.trim(),
      email: values.email.trim(),
      company: values.company.trim(),
      message: values.message.trim()
    });
    if (!saved) {
      setStatus({ type: 'error', msg: 'Something went wrong saving your message. Please email us at hello@jurnii.io.' });
      return;
    }
    setStatus({ type: 'success', msg: "Thanks — your message has been sent. We'll reply within one working day." });
    setValues(EMPTY);
    setTouched({});
    setErrors({});
  };

  return (
    <form className="contact-form" onSubmit={onSubmit} noValidate>
      <div className="row-2">
        {FIELDS.filter((f) => f.half).map((f) =>
        <div className="form-row" key={f.name}>
            <label htmlFor={f.name}>{f.label}</label>
            <input id={f.name} name={f.name} placeholder={f.placeholder}
          value={values[f.name]}
          className={errors[f.name] && touched[f.name] ? 'invalid' : ''}
          onChange={(e) => setField(f.name, e.target.value)}
          onBlur={() => onBlur(f.name)} />
            <p className="form-error">{errors[f.name] && touched[f.name] ? errors[f.name] : ''}</p>
          </div>
        )}
      </div>
      {FIELDS.filter((f) => !f.half).map((f) =>
      <div className="form-row" key={f.name}>
          <label htmlFor={f.name}>{f.label}</label>
          <input id={f.name} name={f.name} type={f.type || 'text'} placeholder={f.placeholder}
        value={values[f.name]}
        className={errors[f.name] && touched[f.name] ? 'invalid' : ''}
        onChange={(e) => setField(f.name, e.target.value)}
        onBlur={() => onBlur(f.name)} />
          <p className="form-error">{errors[f.name] && touched[f.name] ? errors[f.name] : ''}</p>
        </div>
      )}
      <div className="form-row">
        <label htmlFor="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell us what you're working on, your markets, and how we can help."
        value={values.message}
        className={errors.message && touched.message ? 'invalid' : ''}
        onChange={(e) => setField('message', e.target.value)}
        onBlur={() => onBlur('message')} />
        <p className="form-error">{errors.message && touched.message ? errors.message : ''}</p>
      </div>
      <button type="submit" className="btn primary lg" style={{ justifyContent: 'center', marginTop: 6 }}>
        Send message <i data-lucide="arrow-right" style={{ width: 14, height: 14 }} className="arrow" />
      </button>
      {status &&
      <div className={`form-status ${status.type === 'success' ? 'is-success' : 'is-error'}`} role="status" aria-live="polite">
          <i data-lucide={status.type === 'success' ? 'check-circle' : 'alert-circle'} style={{ width: 18, height: 18 }} />
          <span>{status.msg}</span>
        </div>
      }
      <p style={{ fontSize: 12, color: 'var(--muted-foreground)', margin: 0, lineHeight: 1.5 }}>
        By submitting, you agree to be contacted about Jurnii. We don't share your details.
      </p>
    </form>);

}

function App() {
  React.useEffect(() => {
    window.lucide && window.lucide.createIcons();
    // Mount the shared vanilla booking wizard into the aside.
    const mount = () => {
      const node = document.getElementById('jurnii-booking-aside');
      if (window.JurniiBooking && node && !node.getAttribute('data-mounted')) {
        node.setAttribute('data-mounted', '1');
        window.JurniiBooking.render(node, {});
      }
    };
    if (window.JurniiBooking) { mount(); return; }
    let s = document.querySelector('script[data-jurnii-booking]');
    if (!s) {
      s = document.createElement('script');
      s.src = 'assets/booking-form.js';
      s.setAttribute('data-jurnii-booking', '1');
      document.body.appendChild(s);
    }
    s.addEventListener('load', mount);
  }, []);
  return (
    <PageChrome active="contact">
      <PageHero eyebrow="Get in touch" title="Send us a message." lede={<>Questions about the platform, partnerships, or press?<br />Drop us a line and the right person will get back to you.</>} />
      <section className="section reveal">
        <div className="container">
          <div className="contact-grid">
            <div className="contact-col">
              <h3>Send us a message</h3>
              <p>Fill in the form and the right person will get back to you within one working day.</p>
              <MessageForm />
            </div>
            <aside className="contact-aside">
              <h3 style={{ fontFamily: "Geist", fontSize: "18px", letterSpacing: "0px" }}>Prefer to see it live?</h3>
              <p>Three quick steps and a specialist will confirm your slot.</p>
              <div className="contact-booking-form">
                <div id="jurnii-booking-aside"></div>
              </div>
            </aside>
          </div>
        </div>
      </section>
    </PageChrome>);

}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
(function(){
  function load(){
    var s=document.createElement('script');
    s.src='assets/headline-split.js';
    document.body.appendChild(s);
  }
  if('requestIdleCallback' in window) requestIdleCallback(load,{timeout:2000});
  else setTimeout(load,1);
})();
</script>
