      <PageHero eyebrow="Legal" title="Privacy Policy." lede="How we collect, use, and protect your personal data." />
      <section className="section">
        <div className="container">
          <div className="legal-body">
            <div className="legal-meta">
              <span>Effective: June 2025</span>
              <span>Company no. 15727970</span>

            <h2>1. Introduction</h2>
            <p><strong>1.1</strong> Jurnii LTD ("we," "us," "our") is committed to protecting the privacy of our website visitors, service users, individual customers, and customer personnel.</p>
            <p><strong>1.2</strong> This policy applies when we act as a data controller in relation to the personal data of such individuals; that is, when we determine the purposes and means of processing that personal data.</p>
            <p><strong>1.3</strong> Our website provides privacy controls that allow you to manage how we process your personal data. You may use these controls to specify whether you wish to receive direct marketing communications and limit the collection, sharing, and publication of your personal data.</p>
            <p><strong>1.4</strong> We use cookies on our website. When cookies are not strictly necessary for the provision of our website and services, we will ask you to consent to our use of cookies when you first visit our site.</p>
            <p><strong>1.5</strong> In this policy, "we," "us," and "our" refer to Jurnii LTD. For more information about us, see Section 17.</p>

            <h2>2. The Personal Data We Collect</h2>
            <p><strong>2.1</strong> This section outlines the general categories of personal data we may process, including data obtained directly from you or through your interactions with our services.</p>
            <p><strong>2.2</strong> We may process contact data, which includes your name, email address, telephone number, postal address, and social media identifiers. The source of the contact data is you and/or your employer.</p>
            <p><strong>2.3</strong> We may process your profile data, including your name, address, phone number, email, profile picture, gender, date of birth, and employment details, as provided by you or your employer.</p>
            <p><strong>2.4</strong> Service data includes personal data provided in the course of using our services and data generated through such use.</p>
            <p><strong>2.5</strong> Transaction data includes information about transactions, such as purchases of goods and/or services with us and/or through our website.</p>
            <p><strong>2.6</strong> Communication data includes any information contained in communications between you and us.</p>
            <p><strong>2.7</strong> Usage data includes information about your use of our website and services, such as IP address, location, browser type, referral source, length of visit, and website navigation paths.</p>

            <h2>3. Purposes of Processing and Legal Bases</h2>
            <p><strong>3.1</strong> This section details the purposes for which we process personal data and the legal bases for this processing.</p>
            <ul>
              <li><strong>Operations:</strong> To operate our website, process orders, provide services, and manage billing. The legal basis is our legitimate interests in administering our website, services, and business.</li>
              <li><strong>Publications:</strong> To publish data on our website per your instructions. The legal basis is contractual performance.</li>
              <li><strong>Relationships and Communications:</strong> To manage relationships, communicate (excluding direct marketing), and provide support. The legal basis is our legitimate interests in managing communications with our customers.</li>
              <li><strong>Personalisation:</strong> To personalise content and advertisements on our website. The legal basis is our legitimate interest in enhancing user experience.</li>
              <li><strong>Direct Marketing:</strong> To create and send marketing communications with your consent.</li>
              <li><strong>Research and Analysis:</strong> To analyse usage data for improving our website and services. The legal basis is our legitimate interests in business improvement.</li>
              <li><strong>Record Keeping:</strong> To maintain accurate business records. The legal basis is our legitimate interests in effective business administration.</li>
              <li><strong>Security:</strong> To secure our website, services, and business operations. The legal basis is our legitimate interests in protecting against fraud and other security risks.</li>
              <li><strong>Legal Compliance:</strong> To comply with legal obligations or protect vital interests.</li>
            </ul>

            <h2>4. Automated Decision-Making</h2>
            <p><strong>4.1</strong> We may use automated decision-making for profiling and personalisation purposes on our website.</p>

            <h2>5. Providing Your Personal Data to Others</h2>
            <p><strong>5.1</strong> We may disclose personal data to members of our company group if reasonably necessary for the purposes set out in this policy.</p>
            <p><strong>5.2</strong> Our website database may be stored on servers provided by our hosting providers.</p>
            <p><strong>5.3</strong> Financial transactions may be processed by our payment providers. We will only share necessary transaction data for these purposes. See our payment provider's privacy policies for further information.</p>
            <p><strong>5.4</strong> In addition, we may disclose personal data if necessary to comply with a legal obligation, protect your vital interests or those of another person, or for the establishment, exercise, or defence of legal claims.</p>

            <h2>6. International Data Transfers</h2>
            <p><strong>6.1</strong> This section provides information about data transfers outside the UK under UK data protection law.</p>
            <p><strong>6.2</strong> We may transfer data between the UK and the European Economic Area (EEA), subject to applicable adequacy decisions or safeguards.</p>
            <p><strong>6.3</strong> Our website hosting facilities are located in the United Kingdom.</p>

            <h2>7. Data Retention and Deletion</h2>
            <p><strong>7.1</strong> This section outlines our retention policies to ensure we comply with legal obligations regarding data retention and deletion.</p>
            <p><strong>7.2</strong> We retain personal data only as long as necessary for the purposes outlined in this policy, typically no longer than 12 months after your last contact with us.</p>
            <p><strong>7.3</strong> If you grant us a licence to publish personal data, we may retain it after this period per the applicable licence terms.</p>
            <p><strong>7.4</strong> Personal data may also be retained where necessary for legal compliance or vital interests.</p>

            <h2>8. Security of Personal Data</h2>
            <p><strong>8.1</strong> We take appropriate technical and organisational measures to protect personal data from loss, misuse, or alteration.</p>
            <p><strong>8.2</strong> Personal data is stored securely on servers, computers, and devices, with certain data encrypted for additional protection.</p>

            <h2>9. Your Rights</h2>
            <p><strong>9.1</strong> Under UK data protection law, you have rights regarding your personal data, including:</p>
            <ul>
              <li>The right to access, correct, or delete data</li>
              <li>The right to restrict or object to processing</li>
              <li>The right to data portability</li>
              <li>The right to withdraw consent where applicable</li>
              <li>The right to complain to a supervisory authority, such as the UK Information Commissioner's Office (ICO)</li>
            </ul>
            <p><strong>9.2</strong> These rights may be subject to certain limitations. For more details, please refer to the ICO's website.</p>
            <p><strong>9.3</strong> You may exercise these rights by contacting us using the details in Section 17.</p>

            <h2>10. Third-Party Websites</h2>
            <p><strong>10.1</strong> Our website includes links to third-party websites. We are not responsible for the privacy practices or content of these third parties.</p>

            <h2>11. Children's Privacy</h2>
            <p><strong>11.1</strong> Our website and services are not intended for individuals under 18. If we learn of any data collected from individuals under 18, we will promptly delete it.</p>

            <h2>12. Updating Information</h2>
            <p><strong>12.1</strong> Please inform us if your personal data requires correction or updates.</p>

            <h2>13. About Cookies</h2>
            <p><strong>13.1</strong> Cookies are identifiers sent by web servers to web browsers to be stored and returned with requests to improve functionality.</p>
            <p><strong>13.2</strong> Cookies can be "persistent" (remaining until expiration or deletion) or "session" (expiring at the end of each session).</p>

            <h2>14. Cookies We Use</h2>
            <p><strong>14.1</strong> We use cookies for purposes including:</p>
            <ul>
              <li><strong>Authentication:</strong> Identifying you during website navigation</li>
              <li><strong>Security:</strong> Enhancing security and fraud prevention</li>
              <li><strong>Personalisation:</strong> Customising your experience</li>
              <li><strong>Advertising and Analysis:</strong> Serving relevant ads and measuring performance</li>
            </ul>

            <h2>15. Managing Cookies</h2>
            <p><strong>15.1</strong> Most browsers allow you to manage or delete cookies. Consult your browser's help documentation for guidance on managing cookie preferences.</p>

            <h2>16. Amendments</h2>
            <p><strong>16.1</strong> We may update this policy occasionally by publishing a new version on our website. You should review this page periodically for updates.</p>

            <h2>17. Our Details</h2>
            <p><strong>17.1</strong> This website is owned and operated by Jurnii LTD.</p>
            <p><strong>17.2</strong> We are registered in England and Wales under registration number <strong>15727970</strong>, with our registered office at:</p>
            <blockquote>26 Margate Road, London, SW2 5DT</blockquote>
            <p><strong>17.3</strong> You can contact us:</p>
            <ul>
              <li>By post: 26 Margate Road, London, SW2 5DT</li>
              <li>Using our <a href="contact-us.html">website's contact form</a></li>
              <li>By email: <a href="mailto:hello@jurnii.io">hello@jurnii.io</a></li>
            </ul>
          </div>
        </div>
      </section>

  );
