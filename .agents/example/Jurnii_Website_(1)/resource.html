<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resource · Jurnii</title>
<meta name="description" content="A Jurnii resource article.">
<link rel="icon" href="assets/jurnii-icon-light.svg">
<link rel="stylesheet" href="assets/site.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="assets/site.jsx"></script>
<script type="text/babel" src="assets/blocks.jsx"></script>
<script type="text/babel" src="assets/page-sections.jsx"></script>
<script type="text/babel" src="assets/resource-bodies.jsx"></script>
<script type="text/babel">
function App() {
  const slug = new URLSearchParams(window.location.search).get('slug') || 'jurnii-vs-ekimetrics';
  const meta = window.RESOURCES.find(r => r.slug === slug) || window.RESOURCES[0];
  const body = window.RESOURCE_BODIES[meta.slug] || { tldr: [], sections: [], related: [] };
  const related = (body.related || []).map(s => window.RESOURCES.find(r => r.slug === s)).filter(Boolean);
  React.useEffect(() => { window.lucide && window.lucide.createIcons(); }, []);
  return (
    <PageChrome active="resources">
      <article className="resource-article reveal">
        <div className="container-narrow">
          <a className="resource-back" href="resources.html"><i data-lucide="arrow-left" style={{width:12,height:12}}/> All resources</a>
          <span className={`badge cat-${meta.cat}`} style={{marginTop:18}}>{window.CAT_LABEL[meta.cat]}</span>
          <h1 className="h1-page" style={{marginTop:18}}>{meta.title}</h1>
          <p className="article-meta">{meta.readTime} · {meta.date}</p>
          <p className="article-summary">{meta.summary}</p>
          {body.tldr && body.tldr.length > 0 && (
            <aside className="article-tldr">
              <h4>The short version</h4>
              <ul>{body.tldr.map((t,i) => <li key={i}>{t}</li>)}</ul>
            </aside>
          )}
          <div className="article-body">
            {body.sections.map((s,i) => (
              <section key={i}>
                <h2>{s.h}</h2>
                {s.p.map((p,j) => <p key={j}>{p}</p>)}
              </section>
            ))}
          </div>
        </div>
      </article>
      {related.length > 0 && (
        <section className="section reveal">
          <div className="container">
            <div className="section-head">
              <p className="eyebrow"><span className="dot"/>Read next</p>
              <h2 className="h2-section">Related reading.</h2>
            </div>
            <div className="resources-grid">
              {related.map(r => <ResourceCard key={r.slug} r={r}/>)}
            </div>
          </div>
        </section>
      )}
      <CTABand heading="See live intelligence on your competitor set." sub="A 30-minute demo with sample data from your actual market." primary={{label:'Book a demo', href:'contact.html'}}/>
    </PageChrome>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
