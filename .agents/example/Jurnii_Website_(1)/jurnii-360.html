<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurnii 360 · Competitor proposition intelligence for iGaming</title>
<meta name="description" content="See every competitor move, the day it happens. Daily promotion capture, change alerts, and a structured intelligence layer for trading, CRM, and product teams.">
<link rel="icon" href="assets/jurnii-icon-light.svg">
<link rel="stylesheet" href="assets/site.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="assets/site.jsx"></script>
<script type="text/babel" src="assets/blocks.jsx"></script>
<script type="text/babel" src="assets/product-data.jsx"></script>
<script type="text/babel" src="assets/page-sections.jsx"></script>
<script type="text/babel">
function App() {
  const d = window.PRODUCT_DATA['360'];
  return (
    <PageChrome active="product">
      <PageHero kicker={d.kicker} eyebrow={d.eyebrow} title={d.title} lede={d.lede} primaryCta={d.primary} secondaryCta={d.secondary} accentClass={d.accent}/>
      <FeatureGrid heading={d.features.heading} sub={d.features.sub} items={d.features.items}/>
      <OutcomeStrip heading={d.outcomes.heading} sub={d.outcomes.sub} kpis={d.outcomes.kpis}/>
      <Methodology heading={d.method.heading} sub={d.method.sub} steps={d.method.steps}/>
      <PullQuote {...d.quote}/>
      <PersonaList heading={d.personas.heading} sub={d.personas.sub} personas={d.personas.list}/>
      <CTABand heading="See your competitor set, live." sub="A 30-minute demo, with sample data from your actual market." primary={{label:'Book a demo', href:'contact.html'}} secondary={{label:'Read sample report', href:'resources.html?cat=report'}}/>
    </PageChrome>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
