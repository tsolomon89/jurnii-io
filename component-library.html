<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurnii · Component Library (internal)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/jurnii-icon-light.svg">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preload" href="assets/fonts/Geist-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/global.css">
<link rel="stylesheet" href="assets/fonts-mono.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="assets/fonts-mono.css"></noscript>
<link rel="stylesheet" href="assets/site.css">
<style>
  /* ---------- Page chrome ---------- */
  body { background: var(--background); color: var(--foreground); }

  .cl-topbar {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--background) 86%, transparent);
    backdrop-filter: saturate(160%) blur(12px);
    -webkit-backdrop-filter: saturate(160%) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .cl-topbar-inner {
    max-width: 1080px; margin: 0 auto; padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .cl-brandblock { display: flex; align-items: center; gap: 12px; }
  .cl-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
  .cl-sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--muted-foreground); }

  /* segmented theme toggle */
  .cl-toggle { display: inline-flex; gap: 2px; padding: 3px; background: var(--secondary); border-radius: var(--radius-full); border: 1px solid var(--border); }
  .cl-toggle-btn {
    appearance: none; border: 0; cursor: pointer; background: transparent;
    font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--muted-foreground);
    padding: 7px 16px; border-radius: var(--radius-full); transition: background 160ms ease, color 160ms ease;
    white-space: nowrap;
  }
  .cl-toggle-btn:hover { color: var(--foreground); }
  .cl-toggle-btn.is-active { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px rgba(0,0,0,0.10); }

  /* ---------- Main ---------- */
  .cl-main { max-width: 1080px; margin: 0 auto; padding: 0 28px 140px; }
  .cl-intro { padding: 72px 0 24px; max-width: 640px; }
  .cl-eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-foreground); margin: 0 0 12px; }
  .cl-h1 { font-size: clamp(34px, 5vw, 52px); line-height: 1.02; letter-spacing: -0.03em; font-weight: 600; margin: 0 0 18px; }
  .cl-lede { font-size: 18px; line-height: 1.6; color: var(--muted-foreground); margin: 0; }

  /* ---------- Component section ---------- */
  .cl-section { padding: 40px 0; border-top: 1px solid var(--border); }
  .cl-section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  .cl-section-title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .cl-product-tag {
    flex: none; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.02em;
    color: var(--sidebar-primary-foreground); background: var(--sidebar-primary);
    padding: 6px 12px; border-radius: var(--radius-full); white-space: nowrap;
  }

  /* stage area the component sits on */
  .cl-stage {
    position: relative;
    background:
      repeating-linear-gradient(45deg, color-mix(in srgb, var(--foreground) 3%, transparent) 0 1px, transparent 1px 11px),
      var(--accent);
    border: 1px solid var(--border);
    border-radius: var(--radius-2xl);
    padding: 56px 32px;
    display: flex; justify-content: center;
  }
  .cl-stage-label {
    position: absolute; top: 14px; left: 18px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
    color: var(--muted-foreground);
  }
  .cl-stage-inner { width: 100%; max-width: 440px; }
  .cl-stage-inner.wide { max-width: 840px; }
  .cl-stage-inner.xwide { max-width: 1000px; }

  /* ============================================================
     UX SCORECARD  (Rating Card)
     ============================================================ */
  .sc-card {
    --sc-track: #E3E3E3;
    --sc-logo-bg: var(--accent);
    --sc-logo-mark: #2A2A27;
    background: var(--card);
    color: var(--card-foreground);
    border-radius: var(--radius-3xl);
    padding: 30px 30px 34px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 14px 40px -18px rgba(0,0,0,0.22);
    width: 100%;
  }
  [data-theme="jurnii-v1"] .sc-card {
    --sc-track: rgba(0,0,0,0.22);
    --sc-logo-bg: rgba(0,0,0,0.20);
    --sc-logo-mark: #F2F9F9;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 18px 48px -16px rgba(0,0,0,0.45);
  }

  /* header */
  .sc-head { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
  .sc-logo {
    flex: none; width: 64px; height: 64px; border-radius: var(--radius-xl);
    background: var(--sc-logo-bg); display: flex; align-items: center; justify-content: center;
  }
  .sc-brand { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  .sc-region { font-size: 18px; color: var(--muted-foreground); line-height: 1.3; margin-top: 2px; }

  /* gauge */
  .sc-gauge { position: relative; width: 100%; max-width: 330px; margin: 8px auto 6px; }
  .sc-gauge-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .sc-gauge-track { stroke: var(--sc-track); }
  .sc-gauge-value { transition: stroke-dashoffset 1.3s cubic-bezier(0.22, 1, 0.36, 1) 0.05s; }
  .sc-gauge-text {
    position: absolute; left: 0; right: 0; top: 47%;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .sc-gauge-label { font-size: 18px; color: var(--muted-foreground); line-height: 1; margin-bottom: 10px; }
  .sc-gauge-score { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .sc-gauge-num { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .sc-gauge-denom { font-family: var(--font-mono); font-size: 20px; color: var(--muted-foreground); }
  .sc-gauge-rating { font-size: 22px; font-weight: 600; color: var(--poor); margin-top: 8px; letter-spacing: -0.01em; }

  /* categories */
  .sc-cats { display: flex; flex-direction: column; gap: 22px; margin-top: 18px; }
  .sc-cat-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sc-cat-label { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .sc-cat-icon { display: inline-flex; color: var(--card-foreground); }
  .sc-cat-value { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .sc-bar-track { height: 12px; border-radius: var(--radius-full); background: var(--sc-track); overflow: hidden; }
  .sc-bar-fill { height: 100%; border-radius: var(--radius-full); width: 0; transition: width 1.15s cubic-bezier(0.22, 1, 0.36, 1); }

  @media (prefers-reduced-motion: reduce) {
    .sc-gauge-value, .sc-bar-fill { transition: none; }
  }

  @media (max-width: 560px) {
    .cl-topbar-inner, .cl-main { padding-left: 18px; padding-right: 18px; }
    .cl-stage { padding: 48px 16px 28px; }
  }

  /* ============================================================
     SCORE TREND  (shadcn-style multi-line chart)
     ============================================================ */
  .ch-card {
    --ch-brand: #00A312; --ch-c1: #2563EB; --ch-c2: #E8590C; --ch-c3: #7C3AED; --ch-c4: #DB2777;
    --ch-grid: var(--border);
    --ch-axis: var(--muted-foreground);
    background: var(--card); color: var(--card-foreground);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    padding: 24px 24px 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 14px 40px -20px rgba(0,0,0,0.20);
    width: 100%;
  }
  [data-theme="jurnii-v1"] .ch-card {
    --ch-brand: #57FF60; --ch-c1: #60A5FA; --ch-c2: #FB923C; --ch-c3: #C084FC; --ch-c4: #FB7185;
    --ch-grid: rgba(255,255,255,0.10);
    box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 18px 48px -16px rgba(0,0,0,0.45);
  }

  .ch-head { margin-bottom: 18px; }
  .ch-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .ch-desc { font-size: 14px; color: var(--muted-foreground); margin-top: 3px; }

  .ch-plot { position: relative; width: 100%; }
  .ch-svg { width: 100%; height: auto; aspect-ratio: 720 / 300; display: block; overflow: visible; }
  .ch-grid { stroke: var(--ch-grid); stroke-width: 1; }
  .ch-axis-text { fill: var(--ch-axis); font-family: var(--font-mono); font-size: 12px; }
  .ch-cursor { stroke: var(--ch-axis); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.55; }
  .ch-line { }
  .ch-dot { vector-effect: non-scaling-stroke; }

  .ch-tip {
    position: absolute; z-index: 5; pointer-events: none;
    background: var(--popover); color: var(--popover-foreground);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 10px 12px; min-width: 168px;
    box-shadow: 0 8px 28px -8px rgba(0,0,0,0.35);
  }
  .ch-tip-month { font-size: 12px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.01em; }
  .ch-tip-row { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.7; }
  .ch-tip-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .ch-tip-label { color: var(--muted-foreground); }
  .ch-tip-val { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }

  .ch-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; }
  .ch-leg-item { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted-foreground); }
  .ch-leg-item.is-brand { color: var(--card-foreground); font-weight: 600; }
  .ch-leg-swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

  .ch-foot { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .ch-foot-main { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .ch-foot-sub { font-size: 13px; color: var(--muted-foreground); margin-top: 5px; }

  /* ============================================================
     PRICE BOOST CARD  (Jurnii 360 — detected competitor promotion)
     ============================================================ */
  .pb-card {
    --sc-logo-mark: #2A2A27;           /* JurniiMark sparkle fill (shared var name) */
    --pb-logo-bg: var(--accent);
    --pb-panel: var(--accent);
    --pb-pill-bg: var(--primary);
    --pb-pill-fg: var(--primary-foreground);
    background: var(--card);
    color: var(--card-foreground);
    border-radius: var(--radius-3xl);
    padding: 28px 30px 30px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 14px 40px -18px rgba(0,0,0,0.22);
    width: 100%;
  }
  [data-theme="jurnii-v1"] .pb-card {
    --sc-logo-mark: #F2F9F9;
    --pb-logo-bg: rgba(0,0,0,0.20);
    --pb-panel: rgba(0,0,0,0.18);
    box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 18px 48px -16px rgba(0,0,0,0.45);
  }

  /* header */
  .pb-head { display: flex; align-items: flex-start; gap: 16px; }
  .pb-logo {
    flex: none; width: 64px; height: 64px; border-radius: var(--radius-xl);
    background: var(--pb-logo-bg); display: flex; align-items: center; justify-content: center;
  }
  .pb-head-text { flex: 1; min-width: 0; padding-top: 2px; }
  .pb-brand { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  .pb-product { font-size: 18px; color: var(--muted-foreground); line-height: 1.3; margin-top: 3px; }
  .pb-status {
    flex: none; align-self: flex-start; display: inline-flex; align-items: center;
    font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--pb-pill-fg); background: var(--pb-pill-bg);
    padding: 9px 20px; border-radius: var(--radius-full);
  }

  /* match + market */
  .pb-body { margin-top: 24px; }
  .pb-match { font-size: 23px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
  .pb-date { font-size: 17px; color: var(--muted-foreground); margin-top: 5px; }

  .pb-market { margin-top: 24px; }
  .pb-market-label { font-size: 17px; color: var(--muted-foreground); }
  .pb-market-value { font-size: 23px; font-weight: 500; letter-spacing: -0.012em; line-height: 1.28; margin-top: 6px; text-wrap: pretty; }

  /* odds panel */
  .pb-odds {
    margin-top: 24px; background: var(--pb-panel); border-radius: var(--radius-2xl);
    padding: 20px 22px; display: flex; align-items: flex-end; gap: 22px;
  }
  .pb-odds-col { display: flex; flex-direction: column; gap: 10px; }
  .pb-odds-cap { font-size: 17px; color: var(--muted-foreground); line-height: 1; }
  .pb-odds-num { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1; font-variant-numeric: tabular-nums; }
  .pb-odds-num.was { text-decoration: line-through; text-decoration-thickness: 2px; }
  .pb-odds-arrow { display: inline-flex; color: var(--foreground); margin-bottom: 2px; }
  .pb-boost {
    margin-left: auto; align-self: center; flex: none;
    font-size: 18px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--pb-pill-fg); background: var(--pb-pill-bg);
    padding: 9px 18px; border-radius: var(--radius-full);
  }
</style>
<style>
  /* ============================================================
     RECOMMENDATION MODAL  (Jurnii UX)
     Always dark-teal surface — same palette as canvas-comments.
     ============================================================ */
  .rm-root {
    --rm-bg:       #243E41;
    --rm-surf:     #2E4A4D;
    --rm-surf2:    #38595B;
    --rm-line:     rgba(255,255,255,0.09);
    --rm-text:     #F2F9F9;
    --rm-muted:    #9FC6C4;
    --rm-accent:   #94FF96;
    --rm-accent-i: #143A1B;
    --rm-red:      #DC2626;
    width: 100%;
    font-family: var(--font-sans, system-ui, sans-serif);
    -webkit-font-smoothing: antialiased;
  }
  .rm-modal {
    background: var(--rm-surf); color: var(--rm-text);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 2px 4px rgba(0,0,0,.18), 0 28px 60px -20px rgba(0,0,0,.55);
  }
  .rm-modal-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 26px; border-bottom: 1px solid var(--rm-line);
  }
  /* Pin to --rm-text so global h2/h3 { color: var(--foreground) } cannot wash out titles */
  .rm-modal-title { font-size: 21px; font-weight: 600; letter-spacing: -.02em; margin: 0; color: var(--rm-text); }
  .rm-close-btn { background: none; border: none; cursor: pointer; color: var(--rm-muted); padding: 4px; border-radius: 6px; display: flex; }
  .rm-close-btn:hover { color: var(--rm-text); }
  .rm-modal-body { display: grid; grid-template-columns: 1fr 280px; }

  /* Left panel */
  .rm-left { padding: 22px 26px; border-right: 1px solid var(--rm-line); overflow-y: auto; max-height: 580px; }
  .rm-section { padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--rm-line); }
  .rm-section-last { border-bottom: none; margin-bottom: 0; padding-bottom: 4px; }
  .rm-section-h { font-size: 17px; font-weight: 600; margin: 0 0 10px; letter-spacing: -.01em; color: var(--rm-text); }
  .rm-body { font-size: 14px; line-height: 1.65; color: var(--rm-muted); margin: 0; }
  .rm-body strong { color: var(--rm-text); font-weight: 600; }

  .rm-comments-hd { display: flex; align-items: center; justify-content: space-between; }
  .rm-comments-meta { font-size: 13px; color: var(--rm-muted); }
  .rm-comments-sub { font-size: 13.5px; color: var(--rm-muted); margin: 4px 0 14px; }
  .rm-comments-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }

  /* Avatar */
  .rm-avatar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%;
    font-size: 11px; font-weight: 600; color: #143A1B; flex: none;
  }
  .rm-avatar.sm { width: 26px; height: 26px; font-size: 9px; }

  /* Comment */
  .rm-comment {
    background: rgba(255,255,255,.06); border: 1px solid var(--rm-line);
    border-radius: 11px; padding: 12px 14px;
  }
  .rm-comment-head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
  .rm-comment-author { font-size: 13.5px; font-weight: 600; }
  .rm-comment-time { font-size: 12px; color: var(--rm-muted); margin-left: auto; }
  .rm-comment-body { font-size: 13.5px; line-height: 1.55; color: rgba(242,249,249,.88); margin: 0; }
  .rm-reply-item { display: flex; gap: 9px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rm-line); }
  .rm-reply-inner { display: flex; flex-direction: column; gap: 2px; }
  .rm-reply-trigger {
    display: block; width: 100%; text-align: left; margin-top: 10px;
    background: rgba(255,255,255,.04); border: 1px solid var(--rm-line);
    border-radius: 8px; padding: 9px 12px; color: var(--rm-muted);
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .rm-reply-trigger:hover { background: rgba(255,255,255,.09); }

  /* Composer */
  .rm-composer {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.11);
    border-radius: 11px; margin-top: 8px; position: relative;
  }
  .rm-input {
    display: block; width: 100%; box-sizing: border-box; resize: none;
    background: none; border: none; outline: none;
    color: var(--rm-text); font-family: inherit; font-size: 13.5px; line-height: 1.5;
    padding: 11px 13px 4px; min-height: 40px;
  }
  .rm-input::placeholder { color: var(--muted-foreground); opacity: 1; }
  .rm-composer-bar { display: flex; align-items: center; gap: 1px; padding: 2px 7px 7px; }
  .rm-tool { background: none; border: none; cursor: pointer; color: rgba(242,249,249,.45); padding: 5px; border-radius: 5px; display: flex; }
  .rm-tool:hover { color: var(--rm-text); background: rgba(255,255,255,.08); }
  .rm-send-btn {
    margin-left: auto; width: 32px; height: 32px; border-radius: 8px; border: none;
    background: rgba(255,255,255,.10); color: rgba(242,249,249,.4);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .rm-send-btn.active { background: var(--rm-accent); color: var(--rm-accent-i); }
  .rm-send-btn:disabled { cursor: default; }

  /* Sidebar */
  .rm-sidebar {
    padding: 20px 20px 22px;
    display: flex; flex-direction: column; gap: 18px;
    background: rgba(0,0,0,.12);
  }
  .rm-sb-label {
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--rm-muted); margin-bottom: 8px; font-family: var(--font-mono, monospace);
  }
  .rm-select-wrap { position: relative; }
  .rm-select {
    width: 100%; appearance: none; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.13); border-radius: 9px;
    color: var(--rm-text); font-family: inherit; font-size: 14px;
    padding: 9px 32px 9px 12px; cursor: pointer;
  }
  .rm-select:focus { outline: none; border-color: rgba(255,255,255,.28); }
  option { background: #2E4A4D; }
  .rm-select-ico { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--rm-muted); display: flex; }
  .rm-meta-rows { display: flex; flex-direction: column; }
  .rm-meta-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid var(--rm-line); font-size: 13.5px;
  }
  .rm-meta-row:first-child { border-top: 1px solid var(--rm-line); }
  .rm-meta-k { color: var(--rm-muted); }
  .rm-meta-v { font-weight: 500; }
  .rm-badge {
    display: inline-flex; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .rm-badge.high { background: var(--rm-red); color: #fff; }
  .rm-badge.medium { background: #D97706; color: #fff; }
  .rm-badge.low { background: #059669; color: #fff; }

  /* Votes */
  .rm-vote-row { display: flex; align-items: center; gap: 7px; }
  .rm-vote-n { font-size: 17px; font-weight: 600; min-width: 18px; }
  .rm-vote-avs { display: flex; gap: 3px; flex: 1; flex-wrap: wrap; }
  .rm-vote-btn {
    flex: none; width: 34px; height: 34px; border-radius: 8px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
    color: var(--rm-text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 120ms, border-color 120ms;
  }
  .rm-vote-btn:hover { background: rgba(255,255,255,.16); }

<style>
  /* ============================================================
     PROMOTIONS BY VERTICAL  (Jurnii 360 dashboard panel)
     ============================================================ */
  .pv-panel {
    --pv-green: var(--jurnii-700);
    --pv-bar: var(--jurnii-500);
    --pv-row: color-mix(in srgb, var(--card-foreground) 5%, transparent);
    --pv-track: color-mix(in srgb, var(--card-foreground) 12%, transparent);
    background: var(--card); color: var(--card-foreground);
    border: 1px solid var(--border); border-radius: var(--radius-3xl);
    padding: 30px 30px 32px; width: 100%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 14px 40px -18px rgba(0,0,0,0.22);
  }
  [data-theme="jurnii-v1"] .pv-panel, [data-theme="dark"] .pv-panel {
    --pv-green: var(--jurnii-200);
    --pv-bar: var(--jurnii-300);
    box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 18px 48px -16px rgba(0,0,0,0.45);
  }

  .pv-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px 28px; flex-wrap: wrap; margin-bottom: 24px; }
  .pv-head-title { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .pv-head-sub { font-size: 15px; color: var(--muted-foreground); margin-top: 6px; max-width: 48ch; }
  .pv-head-ctrl { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .pv-switchwrap { display: inline-flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 500; cursor: pointer; user-select: none; }
  .pv-switch { appearance: none; border: 0; cursor: pointer; width: 46px; height: 26px; border-radius: 999px; background: var(--pv-track); position: relative; transition: background 0.2s ease; flex: none; }
  .pv-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.3); transition: transform 0.2s cubic-bezier(0.4,0,0.2,1); }
  .pv-switch.on { background: var(--pv-bar); }
  .pv-switch.on::after { transform: translateX(20px); }
  .pv-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--secondary); border-radius: 999px; border: 1px solid var(--border); }
  .pv-seg-btn { appearance: none; border: 0; cursor: pointer; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--muted-foreground); padding: 7px 18px; border-radius: 999px; transition: background 0.16s ease, color 0.16s ease; }
  .pv-seg-btn:hover { color: var(--card-foreground); }
  .pv-seg-btn.on { background: var(--card); color: var(--card-foreground); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

  .pv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: stretch; }
  @media (max-width: 820px) { .pv-grid { grid-template-columns: 1fr; } }

  .pv-sub {
    background: var(--accent); border: 1px solid var(--border); border-radius: var(--radius-2xl);
    padding: 22px 22px 20px; display: flex; flex-direction: column; min-width: 0;
    opacity: 0; transform: translateY(18px);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22,1,0.36,1);
  }
  .pv-panel.is-in .pv-sub { opacity: 1; transform: none; }
  .pv-sub-title { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .pv-sub-sub { font-size: 13px; color: var(--muted-foreground); margin-top: 4px; }

  .pv-sub-body { flex: 1; min-height: 0; padding-top: 18px; }

  .pv-foot .g { color: var(--pv-green); }

  /* donut */
  .pv-donut { position: relative; width: 100%; max-width: 220px; margin: 4px auto 16px; }
  .pv-donut svg { width: 100%; height: auto; display: block; overflow: visible; }
  .pv-donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .pv-donut-num { font-size: 46px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .pv-donut-lbl { font-size: 15px; color: var(--muted-foreground); margin-top: 5px; }
  .pv-legend { display: flex; flex-direction: column; gap: 9px; }
  .pv-leg { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
  .pv-leg-sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .pv-leg-name { flex: 1; min-width: 0; }
  .pv-leg-val { font-variant-numeric: tabular-nums; color: var(--muted-foreground); }

  /* events */
  .pv-events { position: relative; flex: 1; min-height: 0; width: 100%; }
  .pv-events-scroll { height: 100%; max-height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 8px; }
  .pv-events-scroll::-webkit-scrollbar { width: 5px; }
  .pv-events-scroll::-webkit-scrollbar-track { background: transparent; }
  .pv-events-scroll::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--card-foreground) 20%, transparent); border-radius: 99px; }
  .pv-event {
    background: var(--pv-row); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; flex: none;
    opacity: 0; transform: translateY(10px); transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22,1,0.36,1);
  }
  .pv-panel.is-in .pv-event { opacity: 1; transform: none; }
  .pv-event-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .pv-event-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 13px; color: var(--muted-foreground); }
  .pv-event-n { color: var(--card-foreground); font-weight: 600; white-space: nowrap; }
  .pv-events-fade { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; pointer-events: none; background: linear-gradient(to bottom, transparent, var(--accent)); }

  /* brand activity */
  .pv-brands { display: flex; flex-direction: column; gap: 20px; }
  .pv-brand { opacity: 0; transform: translateY(10px); transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22,1,0.36,1); }
  .pv-panel.is-in .pv-brand { opacity: 1; transform: none; }
  .pv-brand-top { display: flex; align-items: center; gap: 12px; }
  .pv-logo { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; letter-spacing: -0.02em; flex: none; }
  .pv-brand-name { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-brand-n { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pv-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--pv-green); background: color-mix(in srgb, var(--pv-green) 16%, transparent); padding: 4px 9px; border-radius: 999px; }
  .pv-bar { height: 9px; border-radius: 999px; background: var(--pv-track); margin-top: 11px; overflow: hidden; }
  .pv-bar-fill { height: 100%; border-radius: 999px; background: var(--pv-bar); width: 0; transition: width 1.1s cubic-bezier(0.22,1,0.36,1); }

  @media (prefers-reduced-motion: reduce) {
    .pv-sub, .pv-event, .pv-brand, .pv-bar-fill { transition: none !important; }
  }
