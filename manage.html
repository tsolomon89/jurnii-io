<!doctype html>
<html data-theme="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage your demo booking · Jurnii</title>
<!-- Reached only via a signed manage link, so it must never be indexed. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/assets/jurnii-icon-light.svg">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://www.googletagmanager.com">
<link rel="preload" href="/assets/fonts/Geist-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
<!--
  A deliberately plain page, outside the SPA.

  It is a real file in `dist/`, which is what makes `/manage.html` resolve: Vercel
  checks the filesystem before applying the `/(.*)` → `/index.html` rewrite, so the
  SPA fallback never swallows this route. Until this file existed, every emailed
  manage link landed on the home page.

  global.css carries the design tokens the booking stylesheet reads (--concrete-*,
  --jurnii-*, --font-sans), and site.css carries the .btn classes its markup uses,
  so all three are needed and all three are served at stable, unhashed paths.
-->
<link rel="stylesheet" href="/assets/global.css">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/booking/assets/booking-form.css">
<style>
  body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .manage-shell { width: 100%; max-width: 680px; }
  .manage-brand { display: flex; justify-content: center; margin-bottom: 24px; }
  .manage-brand img { height: 28px; width: auto; }
</style>
<!--
  This page's URL carries a signed reschedule/cancel token. Publish a REDACTED location
  to the tag layer, before the container loads, so the token is never what any tag reads.

  The address bar is deliberately left alone. booking-form.js reads ?token= and ?id= from
  location.search on every load (createManage, ~line 1965) with nothing persisted, so
  rewriting the URL with history.replaceState would break an ordinary page refresh.
  GA4-side query-parameter redaction is the second layer; this is the first.
-->
<script>
window.dataLayer = window.dataLayer || [];
window.dataLayer.push({
  event: 'page_context_ready',
  page_type: 'manage',
  page_title: document.title,
  page_location: window.location.origin + window.location.pathname,
  canonical_path: window.location.pathname,
  surface: 'www'
});
</script>
<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-PGVJ4K9T');</script>
</head>
<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PGVJ4K9T"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<main class="manage-shell">
  <div class="manage-brand">
    <a href="/" aria-label="Jurnii home"><img src="/assets/jurnii-light-full.svg" alt="Jurnii"></a>
  </div>
  <!-- booking-form.js auto-mounts the reschedule / cancel UI here. -->
  <div id="jurnii-manage-inline"></div>
</main>
<script src="https://unpkg.com/lucide@1.25.0/dist/umd/lucide.min.js"></script>
<!-- Before the widget: the widget dispatches its first events during mount. -->
<script src="/assets/analytics-bridge.js"></script>
<script src="/booking/assets/booking-form.js"></script>
</body>
</html>
