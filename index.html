<script type="text/babel">
function App() {
  return (
    <PageChrome active="home">
      <HomeHero/>
      <HomeLogoBar/>
      <LazySection minHeight={520} className="lazy-ph-tabs">
        <HomeProductTabs/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <HomeProblem/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <HomeHowItWorks/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <HomeProof/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <HomeCompare/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <ResourcesHub featuredOnly={true}/>
      </LazySection>
      <LazySection minHeight={200} className="lazy-ph-section">
        <HomePressBar/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <FAQSection/>
      </LazySection>
    </PageChrome>
  );
}
function mountHome() {
  var needed = ['PageChrome','HomeHero','HomeLogoBar','HomeProductTabs','HomeProblem','HomeHowItWorks','HomeProof','HomeCompare','ResourcesHub','HomePressBar','FAQSection','LazySection'];
  if (needed.some(function(n){ return typeof window[n] === 'undefined'; })) { return setTimeout(mountHome, 30); }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
mountHome();
</script>
<script>
(function(){
  function load(){
    var s=document.createElement('script');
    s.src='assets/headline-split.js';

  }
  if('requestIdleCallback' in window) requestIdleCallback(load,{timeout:2000});
  else setTimeout(load,1);
})();
</script>
