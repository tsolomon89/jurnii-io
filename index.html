<!--
  Google Tag Manager.

  Placed at the END of <head>, not the top. Google asks for "as high as possible", but
  this page's whole CWV posture is CSS-first — every third-party script already sits at
  the end of <body>. Bottom-of-head keeps stylesheet discovery untouched while still
  initialising the container before any body script runs, which is also the correct slot
  for a Consent Mode default block if one is added later.

  No GA4 tag may fire on All Pages. This is one index.html serving 165 routes, and page
  identity is not resolved until the content engine's routing effect runs — long after
  this executes. Every page instead pushes `page_context_ready` exactly once, and the
  pageview fires on that. See src/analytics/page-context.ts and the fallback below.
-->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-PGVJ4K9T');</script>
<!--
  The vendor adapter, loaded synchronously here so it is listening before anything can
  emit. It is the only file that names dataLayer; the booking widget and the CTA
  handler both dispatch plain CustomEvents and know nothing about tag vendors.
-->
<script src="/assets/analytics-bridge.js"></script>
<!--
  Failsafe pageview. ContentEngineApp is what normally pushes page_context_ready, but it
  cannot run until unpkg React and Babel Standalone have downloaded and compiled — and
  the mount loop below tolerates that never happening. Without this, a CDN outage would
  register as zero traffic rather than as degraded traffic.
-->
<script>
(function () {
  window.dataLayer = window.dataLayer || [];
  setTimeout(function () {
    for (var i = 0; i < window.dataLayer.length; i++) {
      if (window.dataLayer[i] && window.dataLayer[i].event === 'page_context_ready') return;
    }
    window.dataLayer.push({
      event: 'page_context_ready',
      page_type: 'unknown',
      page_title: document.title,
      page_location: window.location.origin + window.location.pathname,
      canonical_path: window.location.pathname
    });
  }, 4000);
})();
</script>

<script type="text/babel">
function HomeApp() {
  return (
    <PageChrome active="home">
      <HomeHero/>
      <HomeLogoBar/>
      <LazySection minHeight={520} className="lazy-ph-tabs">
        <HomeProductTabs/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <HomeProblem/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <HomeHowItWorks/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <HomeProof/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <HomeCompare/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <ResourcesHub featuredOnly={true}/>
      </LazySection>
      <LazySection minHeight={200} className="lazy-ph-section">
        <HomePressBar/>
      </LazySection>
      <LazySection minHeight={360} className="lazy-ph-section">
        <FAQSection/>
      </LazySection>
    </PageChrome>
  );
}
window.HomeApp = HomeApp;

function mountRoot() {
  var needed = ['PageChrome','HomeHero','HomeLogoBar','HomeProductTabs','HomeProblem','HomeHowItWorks','HomeProof','HomeCompare','ResourcesHub','HomePressBar','FAQSection','LazySection'];
  var rawPath = window.location.pathname.replace(/\/$/, '').replace(/\.html$/, '');
  var isHome = rawPath === '' || rawPath === '/index';

  if (isHome) {
    if (needed.some(function(n){ return typeof window[n] === 'undefined'; })) { return setTimeout(mountRoot, 30); }
    ReactDOM.createRoot(document.getElementById('root')).render(<HomeApp/>);
  } else if (typeof window.mountContentEngineApp === 'function') {
    window.mountContentEngineApp();
  } else {
    setTimeout(mountRoot, 30);
  }
}
mountRoot();
</script>
<script>
(function(){
  function load(){
    var s=document.createElement('script');
    s.src='/assets/headline-split.js';
    document.body.appendChild(s);
  }
  if('requestIdleCallback' in window) requestIdleCallback(load,{timeout:2000});
  else setTimeout(load,1);
})();
</script>
